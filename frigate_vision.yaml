blueprint:
  name: FrigateVision - Beta
  description: >
    Sends notifications for Frigate events with AI snapshot analysis via ai_task.
    Supports Android and iOS, sublabel tracking, notification cooldown, custom icons,
    and click actions. After each event, publishes a structured detection record to a
    retained MQTT topic so a Lovelace Markdown card can display the latest detection
    and scroll back through history.


    **Required shell commands** — add the following to your `configuration.yaml`
    (then restart Home Assistant):

    ```yaml

    shell_command:
      download_frigate_snapshot: >
        curl -s -o "/config/www/frigate/frigate_event_{{ camera }}_{{ id }}.jpg"
        "{{ snapshot_url }}"
      frigate_build_collage: >-
        /config/scripts/frigate_collage.sh
        "{{ clip_url }}"
        "{{ event_id }}"
        "{{ camera }}"
    ```


    Place `frigate_collage.sh` (and optionally `extract_frigate_frames.sh`) in
    `/config/scripts/` and make them executable (`chmod +x`).
    Both scripts are included in the repository.


    The `frigate_build_collage` command and its script require **ffmpeg** to be
    available inside your Home Assistant container. Most HA OS and Container
    installs include it; if not, install the ffmpeg add-on.

  domain: automation
  input:
    camera:
      name: Frigate Camera Entity
      description: The Frigate camera entity to monitor for events.
      selector:
        entity:
          domain: [camera]
          multiple: false

    label:
      name: Label to Notify On
      description: The Frigate object label to notify on. The automation triggers only on this label.
      default: person
      selector:
        select:
          multiple: false
          options:
            - person
            - dog
            - cat
            - car
            - package
            - bicycle
            - face
          sort: false
          custom_value: false

    helper:
      name: Helper
      description: >
        An Input Boolean helper used to queue AI analysis jobs across multiple cameras.
        Create one helper and reuse it across all FrigateVision automations.
      selector:
        entity:
          domain: [input_boolean]
          multiple: false

    cooldown:
      name: Cooldown
      description: Minimum time between notifications for this camera.
      selector:
        duration:
          enable_day: true

    notify_device:
      name: Mobile Device(s)
      description: >
        Select one or more phones or tablets (with the Home Assistant app) to receive
        notifications.
      selector:
        device:
          integration: mobile_app
          multiple: true

    notification_customization:
      name: Notification Customization
      icon: mdi:message-alert
      description: Configure optional notification features.
      collapsed: true
      input:
        ios_live_view:
          name: iOS Notification
          description: Enable if the target device runs iOS for enhanced notification support.
          default: false
          selector:
            boolean: {}

        append:
          name: Append "Camera"
          description: >
            Add the word "Camera" to the end of the camera name
            (e.g. "Back Yard" becomes "Back Yard Camera").
          default: false
          selector:
            boolean: {}

        expand:
          name: Expand "Cam" to "Camera"
          description: >
            Replace "Cam" with "Camera" in the camera name
            (e.g. "Back Yard Cam" becomes "Back Yard Camera").
          default: false
          selector:
            boolean: {}

        notification_image:
          name: Notification Image
          description: >
            Image shown in the final notification after AI analysis.
            Thumbnail is cropped 1:1 and looks better on phones, especially for
            portrait cameras. Snapshot is the full uncropped frame — more detail,
            but tall on portrait cameras.
          default: thumbnail
          selector:
            select:
              options:
                - label: Thumbnail (1:1 crop, phone-friendly)
                  value: thumbnail
                - label: Snapshot (full frame, best detail)
                  value: snapshot
              mode: list

        notification_timeout:
          name: Notification Timeout (minutes)
          description: Time before Android automatically clears the notification.
          default: 10
          selector:
            number:
              min: 1.0
              max: 480.0
              step: 5.0
              unit_of_measurement: minutes
              mode: slider

        dashboard:
          name: Event Summary Dashboard URI
          description: URI to open when the "View Summary" action button is tapped.
          default: ""
          selector:
            text: {}

    ai_tweaks:
      name: AI Analysis
      icon: mdi:brain
      description: Configure the AI task entity and prompt used to analyse each snapshot.
      collapsed: true
      input:
        ai_task_entity:
          name: AI Task Entity
          description: >
            The ai_task entity to use for snapshot analysis
            (e.g. ai_task.ollama_qwen or ai_task.openai).
          selector:
            entity:
              domain: ai_task

        prompt:
          name: AI Prompt
          description: >
            Base prompt sent to the AI model along with the snapshot/collage image.
            Keep camera-specific layout details in "Scene Context" and named people
            in "Known Identities" below instead of editing this field per-camera —
            that lets you reuse one prompt across multiple FrigateVision automations.
          default: >-
            You are a home security notification system. You're shown one image:
            4 chronological frames from a single event, placed side by side in
            time order from left to right.

            Read all 4 frames as one sequence and identify the single main thing
            that happened — arrival, departure, package delivery, vehicle
            activity, lingering, an animal, etc. Don't describe frames
            individually.

            Respond only with a concise push notification-style summary, 1 to 3
            short sentences, under 50 words. State only what's visible. Do not
            mention cameras, frames, timestamps, image quality, or uncertainty.
            Normal resident activity should be described neutrally, not as
            suspicious.
          selector:
            text:
              multiline: true
              multiple: false

        scene_context:
          name: Scene Context
          description: >
            Optional camera-specific layout description — what's left/right/top/
            bottom in frame, fixed landmarks (vehicles, walkways, neighboring
            structures), and what movement in different directions means (e.g.
            "approaching" vs "departing"). Inserted into the AI instructions
            ahead of the main prompt. Leave blank to skip.
          default: ""
          selector:
            text:
              multiline: true
              multiple: false

        known_identities:
          name: Known Identities
          description: >
            Optional list of named people this camera may recognize via Frigate
            sublabels, and how the AI should describe each one (e.g. "Zach:
            homeowner, describe as routine unless unusual. Gerry, Sue:
            neighbors, mention naturally, not suspicious."). Inserted into the
            AI instructions alongside sublabel context. Leave blank to skip.
          default: ""
          selector:
            text:
              multiline: true
              multiple: false

        use_collage:
          name: Use Multi-Frame Collage for AI Analysis
          description: >
            When enabled, FrigateVision extracts 4 frames from the event clip and
            builds a horizontal-strip image for the AI to analyse instead of a
            single snapshot. This gives the model temporal context across the
            event but requires ffmpeg and the frigate_build_collage shell command
            to be configured. See the blueprint description for setup instructions.
          default: false
          selector:
            boolean: {}

    mqtt_history:
      name: MQTT History
      icon: mdi:history
      description: >
        Configure the MQTT broker and topic used to store detection history for the
        Lovelace dashboard card.
      collapsed: true
      input:
        mqtt_history_topic:
          name: MQTT History Topic
          description: >
            Retained MQTT topic where detection history is published as a JSON array.
            Use a unique topic per installation to avoid collisions.
            Example: frigate/vision/history
          default: frigate/vision/history
          selector:
            text: {}

        mqtt_history_limit:
          name: History Limit
          description: >
            Maximum number of detection records to keep in the history payload.
            Older entries are dropped when this limit is reached.
          default: 10
          selector:
            number:
              min: 1
              max: 50
              step: 1
              mode: slider

        mqtt_broker_sensor:
          name: MQTT History Sensor Entity
          description: >
            The MQTT sensor entity that reads the history topic back into Home Assistant
            (e.g. sensor.frigate_vision_history). See the companion configuration snippet
            for how to define this sensor.
          selector:
            entity:
              domain: sensor

    advanced_options:
      name: Advanced Options
      icon: mdi:cog
      description: Customize Frigate and Home Assistant connection details.
      collapsed: true
      input:
        sublabel:
          name: Include Sublabels
          description: Include Frigate sublabels in the AI prompt context when available.
          default: true
          selector:
            boolean: {}

        ha_url:
          name: Home Assistant URL
          description: >
            Full base URL of your Home Assistant instance.
            If you use a reverse proxy with no custom port
            (e.g. https://homeassistant.example.com), enter that here and leave the
            port field empty.
          default: https://homeassistant.local
          selector:
            text: {}

        ha_port:
          name: Home Assistant Port (optional)
          description: >
            Override port for Home Assistant (e.g. 8123). Leave empty if your reverse
            proxy handles the port.
          default: ""
          selector:
            text: {}

        frigate_url:
          name: Frigate URL
          description: >
            Full base URL of your Frigate instance.
            If you use a reverse proxy with no custom port
            (e.g. https://frigate.example.com), enter that here and leave the port
            field empty.
          default: https://frigate.local
          selector:
            text: {}

        frigate_port:
          name: Frigate Port (optional)
          description: >
            Override port for Frigate (e.g. 8971). Leave empty if your reverse
            proxy handles the port.
          default: ""
          selector:
            text: {}

        debug:
          name: Debug Logging
          description: Enable debug entries in the logbook for this automation.
          default: false
          selector:
            boolean: {}

  source_url: https://github.com/zacharyd3/Frigate-Vision/blob/main/frigate_vision.yaml

# ── Trigger ──────────────────────────────────────────────────────────────────
trigger_variables:
  input_camera: !input camera
  camera: '{{ input_camera | replace(''camera.'', '''') | lower | replace(''-'',''_'') }}'
  input_label: !input label
  label: '{{ input_label | lower }}'

trigger:
  - topic: frigate/events
    payload: '{{ camera }}/new/{{ label }}'
    value_template: >-
      {{ value_json['after']['camera'] | lower | replace('-','_') }}/{{ value_json['type'] }}/{{ value_json['after']['label'] }}
    id: frigate-event
    trigger: mqtt

condition: []

actions:
  # ── Unpack all inputs into local variables ──────────────────────────────────
  - variables:
      input_append: !input append
      input_dashboard: !input dashboard
      input_expand: !input expand
      input_ai_task_entity: !input ai_task_entity
      input_notification_timeout: !input notification_timeout
      input_ios_live_view: !input ios_live_view
      input_notification_image: !input notification_image
      input_prompt: !input prompt
      input_scene_context: !input scene_context
      input_known_identities: !input known_identities
      input_sublabel: !input sublabel
      input_cooldown: !input cooldown
      input_helper: !input helper
      input_debug: !input debug
      input_ha_url: !input ha_url
      input_ha_port: !input ha_port
      input_frigate_url: !input frigate_url
      input_frigate_port: !input frigate_port
      input_label: !input label
      input_mqtt_history_topic: !input mqtt_history_topic
      input_mqtt_history_limit: !input mqtt_history_limit
      input_mqtt_broker_sensor: !input mqtt_broker_sensor
      input_use_collage: !input use_collage
      object: '{{ trigger.payload_json[''after''][''label''] }}'
      label: '{{ object | title }}'
      raw_device: !input notify_device
      camera_name: >
        {% set name = camera | replace('_', ' ') | title %}
        {% if input_expand %}
          {% set name = name | regex_replace('(?i)\\bcam\\b', 'Camera') %}
        {% endif %}
        {{ name ~ (' Camera' if input_append else '') }}
      cooldown: >-
        {{ '%02d:%02d:%02d' | format(
          input_cooldown.hours + (input_cooldown.days * 24),
          input_cooldown.minutes,
          input_cooldown.seconds) }}
      base_url: >
        {{ input_ha_url.rstrip('/') ~ (':' ~ input_ha_port if input_ha_port | trim != '' else '') }}
      frigate_base: >
        {{ input_frigate_url.rstrip('/') ~ (':' ~ input_frigate_port if input_frigate_port | trim != '' else '') }}
      title: ''
      sub_label: ''
      message: 'A {{ label }} was detected on the {{ camera_name }}.'
      id: '{{ trigger.payload_json[''after''][''id''] }}'
      icon: >
        mdi:{{ 'account-outline' if label == 'Person'
              else 'dog'          if label == 'Dog'
              else 'cat'          if label == 'Cat'
              else 'car'          if label == 'Car'
              else 'home-assistant' }}
      clip_url: '{{ base_url }}/api/frigate/notifications/{{ id }}/{{ camera }}/clip.mp4'
      snapshot_url: '{{ base_url }}/api/frigate/notifications/{{ id }}/snapshot.jpg'
      local_snapshot_path: '/config/www/frigate/frigate_event_{{ camera }}_{{ id }}.jpg'
      update_thumbnail: true
      alert_once: true

  # ── Initial notification (fast, before AI runs) ───────────────────────────
  - repeat:
      for_each: '{{ raw_device }}'
      sequence:
        - variables:
            input_notify_device: >
              {{ 'notify.mobile_app_' ~ (device_attr(repeat.item, 'name')
                | lower | replace(' ', '_') | replace("'", '') | replace('`', '') | replace('"', '') | trim) }}
        - service: '{{ input_notify_device }}'
          data:
            title: '{{ label }} detected'
            message: '{{ camera_name }}'
            data:
              channel: '{{ camera_name }} Notifications'
              timeout: '{{ input_notification_timeout * 60 | int }}'
              tag: '{{ id }}'
              group: '{{ camera_name }}'
              notification_icon: '{{ icon }}'
              data:
                ttl: 0
                priority: high
              attachment:
                url: >
                  {% if input_ios_live_view %}
                    {{ clip_url }}?sign=true
                  {% else %}
                    {{ base_url }}/api/frigate/notifications/{{ id }}/thumbnail.jpg
                  {% endif %}
              image: '{{ base_url }}/api/frigate/notifications/{{ id }}/thumbnail.jpg?format=android'
              clickAction: '{{ clip_url }}'
              push:
                interruption-level: active
              alert_once: true
              actions:
                - action: URI
                  title: View Clip
                  uri: '{{ clip_url }}'
                - action: URI
                  title: View Summary
                  uri: '{{ input_dashboard }}'
                - action: URI
                  title: Open Frigate
                  uri: '{{ frigate_base }}/review'

  # ── Event update loop — keep notification fresh until event ends ──────────
  - repeat:
      sequence:
        - wait_for_trigger:
            - topic: frigate/events
              payload: '{{ id }}'
              value_template: '{{ value_json[''after''][''id''] }}'
              trigger: mqtt
          timeout: '{{ input_cooldown }}'
          continue_on_timeout: true
        - variables:
            event: '{{ wait.trigger.payload_json if wait.trigger else none }}'
            new_snapshot: >
              {{ update_thumbnail and event is not none and
                 event['before']['snapshot_time'] != event['after']['snapshot_time'] }}
            stationary_moved: >
              {{ event is not none and
                 event['after']['position_changes'] > event['before']['position_changes'] }}
            sub_label: '{{ event[''after''][''sub_label''] if event is not none else sub_label }}'
            sub_label_changed: >
              {{ event is not none and sub_label != event['before']['sub_label'] }}
            message: >-
              {% if sub_label %}
                {% set ns = namespace(names=[]) %}
                {% for i in range(0, sub_label | length, 2) %}
                  {% set ns.names = ns.names + [sub_label[i] | trim] %}
                {% endfor %}
                {% if ns.names | length > 1 %}
                  {{ ns.names[:-1] | join(', ') ~ ', and ' ~ ns.names[-1] }} were detected on the {{ camera_name }}.
                {% else %}
                  {{ ns.names[0] }} was detected on the {{ camera_name }}.
                {% endif %}
              {% else %}
                A {{ label }} was detected on the {{ camera_name }}.
              {% endif %}
            title: >-
              {% if sub_label %}
                {% set ns = namespace(names=[]) %}
                {% for i in range(0, sub_label | length, 2) %}
                  {% set ns.names = ns.names + [sub_label[i] | trim] %}
                {% endfor %}
                {% if ns.names | length > 1 %}
                  {{ ns.names[:-1] | join(', ') ~ ' & ' ~ ns.names[-1] }} detected
                {% else %}
                  {{ ns.names[0] }} detected
                {% endif %}
              {% else %}
                {{ label }} detected
              {% endif %}

        - choose:
            - conditions:
                - condition: template
                  value_template: '{{ input_debug }}'
              sequence:
                - service: logbook.log
                  data_template:
                    name: FrigateVision
                    message: >
                      DEBUG (event loop):
                        sublabel: {{ sub_label }}
                        alert_once: {{ alert_once }}
                        new_snapshot: {{ new_snapshot }}
                        stationary_moved: {{ stationary_moved }}
                        sublabel_changed: {{ sub_label_changed }}

        - alias: Notify on snapshot update or sublabel change
          choose:
            - conditions:
                - condition: template
                  value_template: '{{ new_snapshot or sub_label_changed }}'
              sequence:
                - repeat:
                    for_each: '{{ raw_device }}'
                    sequence:
                      - variables:
                          input_notify_device: >
                            {{ 'notify.mobile_app_' ~ (device_attr(repeat.item, 'name')
                              | lower | replace(' ', '_') | replace("'", '') | replace('`', '') | replace('"', '') | trim) }}
                      - service: '{{ input_notify_device }}'
                        data:
                          title: '{{ title }}'
                          message: '{{ message }}'
                          data:
                            channel: '{{ camera_name }} Notifications'
                            timeout: '{{ input_notification_timeout * 60 | int }}'
                            tag: '{{ id }}'
                            group: '{{ camera_name }}'
                            data:
                              ttl: 0
                              priority: high
                            notification_icon: '{{ icon }}'
                            attachment:
                              url: >
                                {% if input_ios_live_view %}
                                  {{ clip_url }}?sign=true
                                {% else %}
                                  {{ base_url }}/api/frigate/notifications/{{ id }}/thumbnail.jpg
                                {% endif %}
                            image: '{{ base_url }}/api/frigate/notifications/{{ id }}/thumbnail.jpg?format=android'
                            clickAction: '{{ clip_url }}'
                            push:
                              interruption-level: passive
                            alert_once: true
                            actions:
                              - action: URI
                                title: View Clip
                                uri: '{{ clip_url }}'
                              - action: URI
                                title: View Summary
                                uri: '{{ input_dashboard }}'
                              - action: URI
                                title: Open Frigate
                                uri: '{{ frigate_base }}/review'

      until:
        - condition: template
          value_template: '{{ not wait.trigger or wait.trigger.payload_json[''type''] == ''end'' }}'

  # ── Wait 30 s for Frigate to finalise the snapshot ───────────────────────
  - delay: '00:00:30'

  # ── Queue: wait for any in-progress AI job to finish ─────────────────────
  - alias: Wait for AI queue
    if:
      - condition: state
        entity_id: !input helper
        state: 'on'
    then:
      - wait_for_trigger:
          - platform: state
            entity_id: !input helper
            from: 'on'
            to: 'off'
        timeout:
          minutes: 3
        continue_on_timeout: false

  - action: input_boolean.turn_on
    target:
      entity_id: !input helper

  # ── Download snapshot to /config/www/frigate for ai_task ─────────────────
  - service: shell_command.download_frigate_snapshot
    data:
      camera: '{{ camera }}'
      id: '{{ id }}'
      snapshot_url: '{{ snapshot_url }}'
  - delay: '00:00:03'

  # ── Build multi-frame collage from clip (optional) ────────────────────────
  - alias: Build collage if enabled
    if:
      - condition: template
        value_template: '{{ input_use_collage }}'
    then:
      - service: shell_command.frigate_build_collage
        data:
          clip_url: '{{ clip_url }}'
          event_id: '{{ id }}'
          camera: '{{ camera }}'
      - delay: '00:00:05'

  # ── Collect Frigate zones for AI grounding ────────────────────────────────
  # entered_zones is cumulative over the event, so merge the freshest loop
  # payload (persists after the loop, like sub_label) with the initial trigger
  # payload as a fallback. This is authoritative location data straight from
  # Frigate — far more reliable than letting the model guess where the subject
  # was, and it keeps the AI from inventing areas it never actually entered.
  - variables:
      detected_zones: >-
        {% set ns = namespace(zones=[]) %}
        {% set init = trigger.payload_json['after'] %}
        {% set ns.zones = ns.zones + (init['entered_zones'] or []) + (init['current_zones'] or []) %}
        {% if event is defined and event is not none %}
          {% set last = event['after'] %}
          {% set ns.zones = ns.zones + (last['entered_zones'] or []) + (last['current_zones'] or []) %}
        {% endif %}
        {{ ns.zones | unique | list }}
      # Frigate delivers sub_label as a flat [name, score, name, score, ...]
      # list, so extract just the names for a clean, human-readable string.
      sub_label_names: >-
        {% set ns = namespace(names=[]) %}
        {% if sub_label %}
          {% for i in range(0, sub_label | length, 2) %}
            {% set ns.names = ns.names + [sub_label[i] | trim] %}
          {% endfor %}
        {% endif %}
        {{ ns.names | join(', ') }}

  # ── Debug: pre-AI log ─────────────────────────────────────────────────────
  - alias: Debug pre-AI
    if:
      - condition: template
        value_template: '{{ input_debug }}'
    then:
      - service: logbook.log
        data_template:
          name: FrigateVision
          message: >
            DEBUG (pre-AI):
              snapshot_url: {{ snapshot_url }}
              local_snapshot_path: {{ local_snapshot_path }}
              use_collage: {{ input_use_collage }}
              detected_zones: {{ detected_zones }}
              sub_label_names: {{ sub_label_names }}

  # ── AI snapshot analysis ──────────────────────────────────────────────────
  - alias: 'AI: Analyse Frigate snapshot'
    action: ai_task.generate_data
    response_variable: ai_response
    continue_on_error: true
    data:
      entity_id: '{{ input_ai_task_entity }}'
      task_name: Frigate Event Analysis
      instructions: >
        {% set hour = now().hour %}
        {% if hour >= 21 or hour < 6 %}
        Note: This event occurred at night. Images may be in infrared or low-light.
        {% elif hour >= 6 and hour < 9 %}
        Note: This event occurred in the early morning.
        {% endif %}
        {% if input_scene_context | trim != '' %}
          Scene context:
          {{ input_scene_context }}
        {% endif %}
        {% if input_known_identities | trim != '' %}
          Known identities:
          {{ input_known_identities }}
        {% endif %}
        {% if detected_zones | length > 0 %}
          Detected zones (authoritative location data):
          The camera system tracked the {{ object }} in these zone(s), and ONLY these: {{ detected_zones | join(', ') }}. This is the complete, authoritative record of everywhere the subject went, and it overrides anything you think you see. The subject did NOT enter, approach, reach, or use any place that is not in this list — even if that place is clearly visible in the image. Describe the event using only these zones; do not name any other location.
        {% endif %}
        {% if input_sublabel and sub_label_names %}
          Identity information:
          "{{ sub_label_names }}" was identified in this footage by previous machine learning analysis; use the name(s) naturally in the summary instead of generic terms like "a person".
        {% endif %}
        {{ input_prompt }}
      attachments:
        - media_content_id: >-
            media-source://media_source/local/frigate/frigate_event_{{ camera }}_{{ id }}.jpg
          media_content_type: image/jpeg
  - action: input_boolean.turn_off
    target:
      entity_id: !input helper

  - alias: Debug AI response
    if:
      - condition: template
        value_template: '{{ input_debug }}'
    then:
      - service: logbook.log
        data_template:
          name: FrigateVision
          message: >
            DEBUG (AI response):
              raw: {{ ai_response }}

  - variables:
      message: '{{ ai_response.data | default(message) if ai_response is defined else message }}'

  # ── Final AI notification ─────────────────────────────────────────────────
  - repeat:
      for_each: '{{ raw_device }}'
      sequence:
        - variables:
            input_notify_device: >
              {{ 'notify.mobile_app_' ~ (device_attr(repeat.item, 'name')
                | lower | replace(' ', '_') | replace("'", '') | replace('`', '') | replace('"', '') | trim) }}
        - service: '{{ input_notify_device }}'
          data:
            title: '{{ title }}'
            message: '{{ message }}'
            data:
              channel: '{{ camera_name }} Notifications'
              timeout: '{{ input_notification_timeout * 60 | int }}'
              tag: '{{ id }}'
              group: '{{ camera_name }}'
              notification_icon: '{{ icon }}'
              data:
                ttl: 0
                priority: high
              attachment:
                url: >
                  {% if input_ios_live_view %}
                    {{ clip_url }}?sign=true
                  {% elif input_notification_image == 'snapshot' %}
                    {{ base_url }}/api/frigate/notifications/{{ id }}/snapshot.jpg
                  {% else %}
                    {{ base_url }}/api/frigate/notifications/{{ id }}/thumbnail.jpg
                  {% endif %}
              image: >-
                {{ base_url }}/api/frigate/notifications/{{ id }}/{{ 'snapshot' if input_notification_image == 'snapshot' else 'thumbnail' }}.jpg?format=android
              clickAction: '{{ clip_url }}'
              push:
                interruption-level: passive
              alert_once: true
              actions:
                - action: URI
                  title: View Clip
                  uri: '{{ clip_url }}'
                - action: URI
                  title: View Summary
                  uri: '{{ input_dashboard }}'
                - action: URI
                  title: Open Frigate
                  uri: '{{ frigate_base }}/review'

  # ── Publish detection record to retained MQTT history topic ───────────────
  #
  # Reads the current retained payload back from the sensor, prepends the new
  # record, trims to the configured limit, and republishes.  The retained flag
  # means the history survives HA and broker restarts with no extra storage.
  #
  - alias: Publish detection history to MQTT
    service: mqtt.publish
    data:
      topic: '{{ input_mqtt_history_topic }}'
      retain: true
      payload: >
        {% set history = state_attr(input_mqtt_broker_sensor, 'history') or [] %}

        {% if history is not iterable or history is string %}
          {% set history = [] %}
        {% endif %}

        {% set new_record = {
          'id':        id,
          'camera':    camera_name,
          'label':     label,
          'sublabel':  sub_label,
          'summary':   message,
          'thumbnail': base_url ~ '/api/frigate/notifications/' ~ id ~ '/snapshot.jpg',
          'clip':      clip_url,
          'ts':        now().isoformat()
        } %}

        {{ ([new_record] + history)[:input_mqtt_history_limit | int] | to_json }}

  # ── Cooldown before automation can re-fire ────────────────────────────────
  - delay: '{{ input_cooldown }}'

mode: single
