blueprint:
  name: FrigateVision - GIF Notifications
  description: >
    Sends a mobile notification when Frigate starts a review item (alert or
    detection) on one of your cameras, waits for the whole activity to end,
    then updates the same notification in place with an animated GIF of the
    entire review so you can see what happened at a glance.


    Optionally shows Frigate's own GenAI review summary (Frigate 0.17+) in the
    notification once it has been generated, and the names Frigate recognized
    (face recognition, LPR, etc.) as they come in.


    GIFs are generated by Frigate itself and served through the Frigate
    integration's notification proxy, so nothing extra needs to be installed.
    Animated GIFs show in the notification shade on iOS and on Android 14+.
  domain: automation
  homeassistant:
    min_version: 2025.4.0
  source_url: https://github.com/zacharyd3/Frigate-Vision/blob/main/frigate_vision.yaml
  input:

    cameras:
      name: Frigate Cameras
      description: Frigate camera entities to send notifications for.
      selector:
        entity:
          domain: [camera]
          multiple: true

    notify_device:
      name: Mobile Device(s)
      description: Phone or tablet(s) with the Home Assistant app to notify.
      selector:
        device:
          integration: mobile_app
          multiple: true

    filters:
      name: Filters
      icon: mdi:filter
      collapsed: true
      input:
        severity:
          name: Review Severity
          description: >
            Which Frigate review severities to notify on. Alerts are
            configured per camera in Frigate (review -> alerts), including
            required zones, so "alert" alone is usually what you want.
          default: [alert]
          selector:
            select:
              multiple: true
              options:
                - label: Alert
                  value: alert
                - label: Detection
                  value: detection

        labels:
          name: Labels
          description: >
            Only notify when the review contains one of these objects (or audio
            labels). Leave empty to notify on everything.
          default: []
          selector:
            select:
              multiple: true
              custom_value: true
              sort: false
              options:
                - person
                - car
                - dog
                - cat
                - bird
                - package
                - bicycle
                - motorcycle

        zones:
          name: Zones
          description: >
            Only notify if the review was ever in one of these Frigate zones
            (type your zone names exactly as in your Frigate config, e.g.
            driveway or front_yard). A review that enters a zone partway
            through notifies at that point, and one that has since left the
            zone still counts. Leave empty to ignore zones.
          default: []
          selector:
            select:
              multiple: true
              custom_value: true
              sort: false
              options: []

        cooldown:
          name: Cooldown
          description: >
            Minimum time between new notifications from this automation.
            Updates to a notification that was already sent (GIF, summary,
            names) are never blocked. Use a separate automation per camera for
            per-camera cooldowns.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration: {}

    notification_options:
      name: Notification Options
      icon: mdi:message-image
      collapsed: true
      input:
        notify_immediately:
          name: Notify Immediately
          description: >
            ON = send a notification with a thumbnail as soon as the review
            starts, then update it with the GIF when the activity ends.
            OFF = stay quiet until the GIF is ready and send only that.
          default: true
          selector:
            boolean: {}

        genai_summary:
          name: Use Frigate GenAI Summary
          description: >
            Wait for Frigate's GenAI review summary (Frigate 0.17+ with
            review -> genai enabled). With "Advanced" notification text its
            title and short summary become the notification text (flagged with
            a warning icon if Frigate rates it as a potential threat); in any
            mode it enables the "Summary" button. Has no effect if GenAI
            review summaries are not configured in Frigate.
          default: true
          selector:
            boolean: {}

        message_style:
          name: Notification Text
          description: >
            "Basic" uses the camera name as the title and says what was
            detected, e.g. "Zach was detected" (or "Person was detected" if
            no name is recognized). "Advanced" uses Frigate's GenAI title and
            short summary once they arrive, showing what was detected and the
            camera until then. Android gives an expanded notification a fixed
            height, so every line of text takes room away from the image.
            "Image only" sends no title or text at all, for the biggest
            possible image; tap the notification to see the details in
            Frigate. The camera still shows as the notification group.
          default: summary
          selector:
            select:
              options:
                - label: Basic (camera name and what was detected)
                  value: basic
                - label: Advanced (GenAI title and short summary)
                  value: summary
                - label: Image only (no title or text)
                  value: image

        buttons:
          name: Action Buttons
          description: >
            Buttons to show on the notification (Android shows at most 3).
            Like the text, the button row takes height away from the image;
            pick none for the tallest image. "Summary" appears once Frigate's
            GenAI summary is in and swaps the notification for the full text
            (scene description and observations). It works for as long as the
            notification timeout below. "View GIF" opens the GIF full size.
          default: [summary, clip, frigate]
          selector:
            select:
              multiple: true
              sort: false
              options:
                - label: Summary
                  value: summary
                - label: View GIF
                  value: gif
                - label: View Clip
                  value: clip
                - label: Open in Frigate (needs the External Frigate URL)
                  value: frigate

        sublabel:
          name: Show Recognized Names
          description: >
            Use the names of people Frigate recognized (face recognition)
            instead of the object label, e.g. "Zach detected" instead of
            "Person detected". Names given to other objects, such as known
            license plates on cars, are not shown.
          default: true
          selector:
            boolean: {}

        append:
          name: Append "Camera"
          description: Add "Camera" to the end of camera names.
          default: false
          selector:
            boolean: {}

        expand:
          name: Expand "Cam" to "Camera"
          default: false
          selector:
            boolean: {}

        tap_action:
          name: Tap Action
          description: What opens when the notification itself is tapped.
          default: frigate
          selector:
            select:
              options:
                - label: Review in Frigate (falls back to the clip if no Frigate URL is set)
                  value: frigate
                - label: Event clip
                  value: clip

        notification_timeout:
          name: Notification Timeout (minutes)
          description: Dismiss the notification automatically after this long.
          default: 60
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: minutes
              mode: box

    advanced_options:
      name: Advanced Options
      icon: mdi:cog
      collapsed: true
      input:
        base_url:
          name: External Home Assistant URL
          description: >
            Public URL of Home Assistant including the port if needed (e.g.
            https://ha.example.com or https://my.ddns:8123). Used for the
            "View Clip" button. Leave blank to open the clip inside the
            companion app instead.
          default: ""
          selector:
            text: {}

        frigate_url:
          name: External Frigate URL
          description: >
            Public URL of the Frigate UI (e.g. https://frigate.example.com or
            https://my.ddns:8971). Used for the "Open in Frigate" button. Leave
            blank to hide that button.
          default: ""
          selector:
            text: {}

        mqtt_topic:
          name: Frigate Reviews MQTT Topic
          description: Change only if you set a custom MQTT topic_prefix in Frigate.
          default: frigate/reviews
          selector:
            text: {}

        max_review_wait:
          name: Maximum Review Length
          description: >
            Stop waiting for Frigate to end a review after this long and send
            the GIF anyway.
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration: {}

        gif_delay:
          name: GIF Delay (seconds)
          description: >
            How long to wait after the review ends before requesting the GIF.
            Frigate pads the review GIF with ~8s after the activity, so waiting
            at least that long gives the complete clip.
          default: 10
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: seconds
              mode: slider

        genai_timeout:
          name: GenAI Summary Timeout (seconds)
          description: How long to wait for Frigate's GenAI summary after the review ends.
          default: 90
          selector:
            number:
              min: 10
              max: 600
              step: 5
              unit_of_measurement: seconds
              mode: slider

# ---------------------------------------------------------------------------
# Each Frigate review item gets its own run, so several cameras can be active
# at once. Every message on the reviews topic is evaluated, but a run only
# starts the first time a review matches the filters (on "new", or on the
# "update" where it first gains a matching severity, label or zone).
# ---------------------------------------------------------------------------
mode: parallel
max: 100
max_exceeded: silent

triggers:
  - trigger: mqtt
    topic: !input mqtt_topic

variables:
  input_cameras: !input cameras
  input_devices: !input notify_device
  input_severity: !input severity
  input_labels: !input labels
  input_zones: !input zones
  input_cooldown: !input cooldown

  watched_cameras: >
    {{ input_cameras | map('replace', 'camera.', '') | list }}
  labels: "{{ input_labels | map('lower') | list }}"
  zones: >
    {{ input_zones | map('trim') | map('lower') | map('replace', ' ', '_')
       | map('replace', '-', '_') | reject('eq', '') | list }}

  should_notify: >
    {% macro matches(r) -%}
      {%- set d = r.data | default({}) -%}
      {%- set found = (d.objects | default([]) + d.audio | default([]))
            | map('replace', '-verified', '') | map('lower') | list -%}
      {%- set cam_ok = (r.camera | default('') | lower | replace('-', '_')) in watched_cameras -%}
      {%- set sev_ok = r.severity | default('') in input_severity -%}
      {%- set label_ok = not labels or found | select('in', labels) | list | count > 0 -%}
      {%- set in_zones = d.zones | default([]) | map('lower') | map('replace', ' ', '_')
            | map('replace', '-', '_') | list -%}
      {%- set zone_ok = not zones or in_zones | select('in', zones) | list | count > 0 -%}
      {{- cam_ok and sev_ok and label_ok and zone_ok -}}
    {%- endmacro %}
    {% set p = trigger.payload_json | default({}) %}
    {% if p.type | default('') == 'new' %}
      {{ matches(p.after) == 'True' }}
    {% elif p.type | default('') == 'update' %}
      {{ matches(p.after) == 'True' and matches(p.before) != 'True' }}
    {% else %}
      false
    {% endif %}

  cooldown_seconds: >
    {{ (input_cooldown.days | default(0)) * 86400
       + (input_cooldown.hours | default(0)) * 3600
       + (input_cooldown.minutes | default(0)) * 60
       + (input_cooldown.seconds | default(0)) }}

conditions:
  - condition: template
    value_template: "{{ should_notify }}"
  - alias: Cooldown since the last notification
    condition: template
    value_template: >
      {{ cooldown_seconds == 0
         or this.attributes.last_triggered is none
         or now().timestamp() - as_timestamp(this.attributes.last_triggered, 0) >= cooldown_seconds }}

actions:

  # ── Resolve inputs and static per-review values ────────────────────────────
  - variables:
      input_notify_immediately: !input notify_immediately
      input_genai_summary: !input genai_summary
      input_message_style: !input message_style
      input_buttons: !input buttons
      input_summary_button: "{{ 'summary' in input_buttons }}"
      input_sublabel: !input sublabel
      input_append: !input append
      input_expand: !input expand
      input_tap_action: !input tap_action
      input_notification_timeout: !input notification_timeout
      input_base_url: !input base_url
      input_frigate_url: !input frigate_url
      input_max_review_wait: !input max_review_wait
      input_gif_delay: !input gif_delay
      input_genai_timeout: !input genai_timeout
      input_mqtt_topic: !input mqtt_topic

      # Frigate's tracked object topic, used to tell which recognized names
      # (sub labels) belong to people
      events_topic: >
        {{ input_mqtt_topic | trim | regex_replace('reviews$', 'events') }}

      review: "{{ trigger.payload_json.after }}"
      review_id: "{{ review.id }}"
      camera: "{{ review.camera }}"
      event_id: "{{ (review.data.detections | default([]) | first) or '' }}"

      # Names of recognized people. A review only lists its sub labels, not
      # which object each belongs to, so they are only taken from the review
      # when every object in it is a person. Otherwise names come from
      # person objects on Frigate's events topic (see the loop below).
      person_names: >
        {% set d = review.data | default({}) %}
        {% set others = d.objects | default([]) | map('replace', '-verified', '')
             | reject('in', ['person', 'face']) | list %}
        {{ [] if others else d.sub_labels | default([]) | map('string')
             | reject('eq', '') | unique | list }}

      camera_name: >
        {% set name = camera | replace('_', ' ') | replace('-', ' ') | title %}
        {% if input_expand %}
          {% set name = name | regex_replace('(?i)\\bcam\\b', 'Camera') %}
        {% endif %}
        {{ name ~ (' Camera' if input_append else '') }}

      notify_services: >
        {% set ns = namespace(services=[]) %}
        {% for device in input_devices %}
          {% set ns.services = ns.services
               + ['notify.mobile_app_' ~ (device_attr(device, 'name') | slugify)] %}
        {% endfor %}
        {{ ns.services }}

      # Images (relative paths are resolved by the companion app)
      gif_url: /api/frigate/notifications/{{ review_id }}/review_preview.gif
      # Square object thumbnail. Deliberately not ?format=android, which pads
      # it out to a wide 2:1 image with bars on either side.
      thumbnail_url: >
        {% if event_id %}/api/frigate/notifications/{{ event_id }}/thumbnail.jpg
        {% else %}/api/frigate/notifications/{{ review_id }}/{{ camera }}/review_thumbnail.webp{% endif %}

      # Links
      clip_url: >
        {% if event_id %}{{ input_base_url | trim | regex_replace('/+$', '') }}/api/frigate/notifications/{{ event_id }}/{{ camera }}/clip.mp4{% endif %}
      frigate_review_url: >
        {% set f = input_frigate_url | trim | regex_replace('/+$', '') %}
        {% if f %}{{ f }}/review?id={{ review_id }}{% endif %}
      tap_url: >
        {% if input_tap_action == 'frigate' and frigate_review_url %}{{ frigate_review_url }}
        {% else %}{{ clip_url or frigate_review_url }}{% endif %}
      action_buttons: >
        {% set buttons = [] %}
        {% if clip_url and 'clip' in input_buttons %}
          {% set buttons = buttons + [{'action': 'URI', 'title': 'View Clip', 'uri': clip_url}] %}
        {% endif %}
        {% if frigate_review_url and 'frigate' in input_buttons %}
          {% set buttons = buttons + [{'action': 'URI', 'title': 'Open in Frigate', 'uri': frigate_review_url}] %}
        {% endif %}
        {{ buttons }}
      summary_action: FRIGATE_VISION_SUMMARY_{{ review_id }}
      zero_width_space: "\u200B"
      gif_open_url: >
        {{ input_base_url | trim | regex_replace('/+$', '') }}{{ gif_url }}

      max_wait_seconds: >
        {{ (input_max_review_wait.hours | default(0)) * 3600
           + (input_max_review_wait.minutes | default(0)) * 60
           + (input_max_review_wait.seconds | default(0)) }}

      # State for the notification loop below
      #   stage: active -> ended -> [summary ->] finish -> [tap -> finish ->] done
      stage: active
      send: "{{ input_notify_immediately }}"
      show_gif: false
      show_summary: false
      alerted: false
      summary: {}

  # ── Notification loop ──────────────────────────────────────────────────────
  # Each pass (1) sends/updates the notification if `send` is set, then
  # (2) waits for whatever the current stage is waiting on. The notification
  # always uses the same tag, so every send replaces the previous one.
  - repeat:
      until:
        - condition: template
          value_template: "{{ stage == 'done' }}"
      sequence:

        - if:
            - condition: template
              value_template: "{{ send and notify_services | count > 0 }}"
          then:
            - variables:
                n_subject: >
                  {% set d = review.data | default({}) %}
                  {% set names = person_names if input_sublabel else [] %}
                  {% set things = (d.objects | default([]) + d.audio | default([]))
                       | map('replace', '-verified', '') | map('replace', '_', ' ')
                       | unique | list %}
                  {% set items = names if names else things %}
                  {% if items | count > 1 %}
                    {% set text = items[:-1] | join(', ') ~ ' and ' ~ items[-1] %}
                  {% elif items %}
                    {% set text = items[0] %}
                  {% else %}
                    {% set text = 'activity' %}
                  {% endif %}
                  {{ text[:1] | upper ~ text[1:] }}
                n_duration: >
                  {% if show_gif and review.end_time %}
                    {% set s = (review.end_time - review.start_time) | round(0) | int %}
                    {{ '%d:%02d' | format(s // 60, s % 60) }}
                  {% endif %}
                n_threat: "{{ summary.potential_threat_level | default(0, true) | int(0) }}"
                # Basic: the camera name. Advanced: Frigate's GenAI title, or
                # what was detected until it arrives.
                n_title: >
                  {% if input_message_style == 'basic' %}{{ camera_name }}
                  {% else %}
                    {% set t = summary.title | default('', true) or n_subject ~ ' detected' %}
                    {{ ('🚨 ' if n_threat >= 2 else '⚠️ ' if n_threat == 1 else '') ~ t }}
                  {% endif %}
                # Basic: what was detected. Advanced: Frigate's short summary,
                # or the camera and duration until it arrives. After the
                # Summary button: the full scene description and observations.
                # Not used in "Image only" mode.
                n_message: >
                  {% if show_summary %}
                    {% set ns = namespace(parts=[]) %}
                    {% set scene = summary.scene | default('', true)
                         or summary.shortSummary | default('', true) %}
                    {% if scene %}{% set ns.parts = [scene] %}{% endif %}
                    {% for key in ['observations', 'other_concerns'] %}
                      {% set items = summary[key] | default([], true) %}
                      {% set items = [items] if items is string else items %}
                      {% if items %}
                        {% set ns.parts = ns.parts
                             + [items | map('regex_replace', '^', '• ') | join('\n')] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.parts | join('\n\n') }}
                  {% elif input_message_style == 'basic' %}{{ n_subject }} was detected
                  {% elif input_message_style == 'summary'
                       and summary.shortSummary | default('', true) %}{{ summary.shortSummary }}
                  {% else %}{{ camera_name }}{{ ' (' ~ n_duration ~ ')' if n_duration else '' }}{% endif %}
                n_buttons: >
                  {% set has_details = summary.scene | default('', true)
                       or summary.observations | default([], true) %}
                  {% set b = action_buttons %}
                  {% if input_summary_button and has_details and not show_summary %}
                    {% set b = [{'action': summary_action, 'title': 'Summary'}] + b %}
                  {% endif %}
                  {% if 'gif' in input_buttons and show_gif %}
                    {% set b = [{'action': 'URI', 'title': 'View GIF', 'uri': gif_open_url}] + b %}
                  {% endif %}
                  {{ b[:3] }}
                # The expanded summary is sent without an image so Android
                # shows the whole text instead of a one-line caption.
                n_data: >
                  {% set d = {
                       'tag': review_id,
                       'group': camera_name,
                       'channel': camera_name ~ ' Notifications',
                       'timeout': (input_notification_timeout * 60) | int,
                       'ttl': 0,
                       'priority': 'high',
                       'alert_once': true,
                       'clickAction': tap_url,
                       'url': tap_url,
                       'push': {'interruption-level': 'passive' if alerted else 'active'},
                       'actions': n_buttons } %}
                  {% if not show_summary %}
                    {% set d = dict(d,
                         image=gif_url if show_gif else thumbnail_url,
                         attachment={'url': gif_url if show_gif else thumbnail_url}) %}
                  {% endif %}
                  {{ d }}
                # "Image only": no title, and a zero-width space as the message
                # (a message is required, and some phones drop a blank one)
                n_image_only: "{{ input_message_style == 'image' and not show_summary }}"
                n_service_data: >
                  {% set d = {'message': zero_width_space if n_image_only else n_message,
                              'data': n_data} %}
                  {{ d if n_image_only else dict(d, title=n_title) }}
            - repeat:
                for_each: "{{ notify_services }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data: "{{ n_service_data }}"
            - variables:
                alerted: true

        - choose:

            # Review in progress: follow updates until Frigate ends it, and
            # pick up the names of people recognized on this camera
            - conditions: "{{ stage == 'active' }}"
              sequence:
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: !input mqtt_topic
                      value_template: "{{ value_json.after.id }}"
                      payload: "{{ review_id }}"
                    - trigger: mqtt
                      topic: "{{ events_topic }}"
                      value_template: "{{ value_json.after.camera }}|{{ value_json.after.label }}|{{ 'named' if value_json.after.sub_label else '' }}"
                      payload: "{{ camera }}|person|named"
                  timeout:
                    seconds: "{{ max_wait_seconds }}"
                  continue_on_timeout: true
                - variables:
                    object_update: >
                      {{ wait.trigger is not none and wait.trigger.topic == events_topic }}
                    previous: "{{ review }}"
                    previous_names: "{{ person_names }}"
                    review: >
                      {{ wait.trigger.payload_json.after
                         if wait.trigger and not object_update else review }}
                    stage: >
                      {{ 'ended' if not wait.trigger
                         or (not object_update and wait.trigger.payload_json.type == 'end')
                         else 'active' }}
                    person_names: >
                      {% set ns = namespace(names=person_names) %}
                      {% if object_update %}
                        {% set o = wait.trigger.payload_json.after %}
                        {% set name = o.sub_label[0] if o.sub_label is list else o.sub_label %}
                        {% if name and (o.id in review.data.detections | default([])
                             or o.start_time | float(0) >= review.start_time | float(0)) %}
                          {% set ns.names = ns.names + [name | string] %}
                        {% endif %}
                      {% else %}
                        {% set d = review.data | default({}) %}
                        {% set others = d.objects | default([]) | map('replace', '-verified', '')
                             | reject('in', ['person', 'face']) | list %}
                        {% if not others %}
                          {% set ns.names = ns.names + (d.sub_labels | default([]) | map('string') | list) %}
                        {% endif %}
                      {% endif %}
                      {{ ns.names | reject('eq', '') | unique | list }}
                    names_changed: >
                      {{ input_sublabel and (person_names | sort) != (previous_names | sort) }}
                    objects_changed: >
                      {{ (review.data.objects | default([]) | sort)
                         != (previous.data.objects | default([]) | sort) }}
                    send: >
                      {{ input_notify_immediately and stage == 'active'
                         and (names_changed or objects_changed) }}

            # Review ended: give Frigate time to finish the preview, then send
            # the GIF. A GenAI summary that lands in the meantime is included.
            - conditions: "{{ stage == 'ended' }}"
              sequence:
                - variables:
                    gif_ready_at: "{{ now().timestamp() + input_gif_delay }}"
                - if:
                    - condition: template
                      value_template: "{{ input_genai_summary and input_gif_delay > 0 }}"
                  then:
                    - wait_for_trigger:
                        - trigger: mqtt
                          topic: !input mqtt_topic
                          value_template: "{{ value_json.after.id }}|{{ value_json.type }}"
                          payload: "{{ review_id }}|genai"
                      timeout:
                        seconds: "{{ input_gif_delay }}"
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ wait.trigger is not none }}"
                      then:
                        - variables:
                            summary: >
                              {{ wait.trigger.payload_json.after.data.metadata | default({}, true) }}
                        - delay:
                            seconds: "{{ [gif_ready_at - now().timestamp(), 0] | max }}"
                  else:
                    - delay:
                        seconds: "{{ input_gif_delay }}"
                - variables:
                    show_gif: true
                    send: true
                    stage: >
                      {{ 'summary' if input_genai_summary and not summary else 'finish' }}

            # GIF sent: wait a while longer for Frigate's GenAI summary
            - conditions: "{{ stage == 'summary' }}"
              sequence:
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: !input mqtt_topic
                      value_template: "{{ value_json.after.id }}|{{ value_json.type }}"
                      payload: "{{ review_id }}|genai"
                  timeout:
                    seconds: "{{ input_genai_timeout }}"
                  continue_on_timeout: true
                - variables:
                    summary: >
                      {{ wait.trigger.payload_json.after.data.metadata | default({}, true)
                         if wait.trigger else {} }}
                    send: "{{ summary | count > 0 }}"
                    stage: finish

            # Last update sent: if it has a Summary button, keep listening
            # for it until the notification times out
            - conditions: "{{ stage == 'finish' }}"
              sequence:
                - variables:
                    has_details: >
                      {{ summary.scene | default('', true) | length > 0
                         or summary.observations | default([], true) | length > 0 }}
                    stage: >
                      {{ 'tap' if input_summary_button and has_details
                         and not show_summary else 'done' }}
                    send: false

            # Summary tapped: re-send the notification with the full text
            - conditions: "{{ stage == 'tap' }}"
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ summary_action }}"
                  timeout:
                    minutes: "{{ input_notification_timeout }}"
                  continue_on_timeout: true
                - variables:
                    show_summary: "{{ wait.trigger is not none }}"
                    send: "{{ wait.trigger is not none }}"
                    stage: "{{ 'finish' if wait.trigger else 'done' }}"

          default:
            - variables:
                stage: done
                send: false
