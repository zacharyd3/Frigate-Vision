blueprint:
  name: FrigateVision - Multi-Camera Journeys
  description: >
    Follows an object as it moves between your cameras and sends one
    notification for the whole "journey", with a custom animated GIF built
    from the recordings that cuts from one camera to the next as the object
    moves (e.g. Street -> Driveway -> Front Door).


    The notification is sent once the journey is completely done: the GIF
    is built and Frigate's GenAI summary is in. It arrives 30-90s after the
    object is gone, and never changes after that.


    Reviews on your cameras are linked into one journey when they are for the
    same kind of object (person, car, dog...) and each one starts within the
    Link Gap of the previous one ending. A journey that stays on one camera
    gets a one-camera GIF, so use this instead of the regular Frigate Vision
    blueprint for these cameras.


    Needs a one-time setup: copy frigate_vision_multicam.py to
    /config/frigate_vision/ and add this to configuration.yaml, then restart:


    shell_command:
      frigate_vision_multicam: "python3 /config/frigate_vision/frigate_vision_multicam.py {{ args }}"


    See the README for details. If the GIF can't be built, the notification
    falls back to Frigate's own GIF of the first camera.
  domain: automation
  homeassistant:
    min_version: 2025.4.0
  source_url: https://github.com/zacharyd3/Frigate-Vision/blob/main/frigate_vision_multicam.yaml
  input:

    cameras:
      name: Frigate Cameras
      description: >
        Frigate camera entities to follow objects across. A journey can move
        between any of these cameras.
      selector:
        entity:
          domain: [camera]
          multiple: true

    notify_device:
      name: Mobile Device(s)
      description: Phone or tablet(s) with the Home Assistant app to notify.
      selector:
        device:
          integration: mobile_app
          multiple: true

    filters:
      name: Filters
      icon: mdi:filter
      collapsed: true
      input:
        severity:
          name: Review Severity
          description: >
            Which Frigate review severities start a journey. See "Link
            Detections" below for the reviews that join one.
          default: [alert]
          selector:
            select:
              multiple: true
              options:
                - label: Alert
                  value: alert
                - label: Detection
                  value: detection

        labels:
          name: Labels
          description: >
            Objects to follow. Pick at least one. A journey follows one kind of
            object: if the review that starts it has more than one of these,
            it follows the one highest in this list (so a person getting out
            of a car is followed as a person).
          selector:
            select:
              multiple: true
              mode: list
              sort: false
              options:
                - label: Person
                  value: person
                - label: Car
                  value: car
                - label: Truck
                  value: truck
                - label: Motorcycle
                  value: motorcycle
                - label: Bicycle
                  value: bicycle
                - label: Package
                  value: package
                - label: Dog
                  value: dog
                - label: Cat
                  value: cat
                - label: Bird
                  value: bird
                - label: Deer
                  value: deer
                - label: Horse
                  value: horse
                - label: Bear
                  value: bear

        link_detections:
          name: Link Detections
          description: >
            ON = a review of any severity can join a journey once it has
            started (e.g. a "detection" on the driveway camera joining a
            person "alert" at the front door). OFF = only reviews that pass
            the Review Severity filter can join.
          default: true
          selector:
            boolean: {}

        cooldown:
          name: Cooldown
          description: >
            Minimum time between new notifications from this automation,
            counted from the last review that started or joined a journey.
            Reviews that join a journey in progress are always added to it.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration: {}

    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        link_gap:
          name: Link Gap (seconds)
          description: >
            How long after the object was last seen a review on another
            camera still counts as the same journey. Reviews that overlap are
            always linked. A longer gap follows objects further (e.g. walking
            around the house out of view), but the notification comes that
            much later, because the journey only ends once this much time has
            passed with nothing new.
          default: 20
          selector:
            number:
              min: 0
              max: 300
              step: 1
              unit_of_measurement: seconds
              mode: slider

        max_journey:
          name: Maximum Journey Length
          description: >
            Stop following the journey after this long and send the GIF
            anyway.
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration: {}

        recording_delay:
          name: Recording Delay (seconds)
          description: >
            How long to wait after the journey ends (the Link Gap has passed
            with nothing new) before fetching the recordings. Frigate only
            saves a recording once its segment (about 10s) is finished; the
            script retries a short clip a few times anyway.
          default: 15
          selector:
            number:
              min: 0
              max: 120
              step: 1
              unit_of_measurement: seconds
              mode: slider

        render_timeout:
          name: GIF Timeout (seconds)
          description: >
            Give up on the custom GIF after this long and use Frigate's GIF
            of the first camera. Rendering full resolution recordings can
            take a while on slow hardware such as a Raspberry Pi.
          default: 180
          selector:
            number:
              min: 30
              max: 900
              step: 10
              unit_of_measurement: seconds
              mode: box

        genai_timeout:
          name: GenAI Summary Timeout (seconds)
          description: >
            How long after the journey ends to wait for Frigate's GenAI
            summaries before sending the notification (when the notification
            or the history uses them). Only the reviews Frigate summarises are
            waited for (read from Frigate's config through the Frigate URL
            below, or alerts only if that's blank), so without GenAI in
            Frigate there's no wait. The notification goes as soon as they are
            all in.
          default: 90
          selector:
            number:
              min: 10
              max: 600
              step: 5
              unit_of_measurement: seconds
              mode: slider

    gif_options:
      name: GIF
      icon: mdi:file-gif-box
      collapsed: true
      input:
        frigate_api_url:
          name: Frigate URL (from Home Assistant)
          description: >
            The URL Home Assistant uses to reach Frigate's API, usually the
            same one the Frigate integration uses. For the Frigate add-on
            this is http://ccab4aaf-frigate:5000 (ccab4aaf-frigate-fa for the
            full access add-on, ccab4aaf-frigate-beta for the beta). Use the
            unauthenticated port 5000, not 8971. Leave blank to skip the
            custom GIF and use Frigate's GIF of the first camera.
          default: http://ccab4aaf-frigate:5000
          selector:
            text: {}

        gif_shape:
          name: Frame Shape
          description: >
            "Auto" follows the cameras in each journey: portrait if they are
            all portrait (e.g. doorbell or hallway cameras), landscape if they
            are all landscape, and square if the journey mixes both. Or pick
            one shape for every GIF. Cameras that don't match the shape are
            fitted inside it.
          default: auto
          selector:
            select:
              options:
                - label: Auto (match the cameras)
                  value: auto
                - label: Landscape (16:9)
                  value: landscape
                - label: Portrait (9:16)
                  value: portrait
                - label: Square
                  value: square

        gif_size:
          name: Size
          description: >
            Length of the GIF's longest side. Bigger is sharper, but makes a
            bigger file and takes longer to build.
          default: 640
          selector:
            number:
              min: 240
              max: 1280
              step: 2
              unit_of_measurement: px
              mode: box

        gif_background:
          name: Background
          description: >
            What fills the space around a camera that doesn't match the frame
            shape: a blurred copy of the camera itself (like phones show
            vertical video), or plain black bars (smaller file).
          default: blur
          selector:
            select:
              options:
                - label: Blurred
                  value: blur
                - label: Black
                  value: black

        gif_fps:
          name: Frames per Second
          description: More frames play smoother, but make a bigger file.
          default: 8
          selector:
            number:
              min: 2
              max: 15
              step: 1
              mode: slider

        gif_speed:
          name: Playback Speed
          description: How much faster than real time the GIF plays.
          default: 2
          selector:
            number:
              min: 1
              max: 10
              step: 0.5
              unit_of_measurement: x
              mode: slider

        gif_max_length:
          name: Maximum GIF Length (seconds)
          description: >
            Long journeys are sped up further so the GIF fits in this length.
            iOS only shows images up to 10 MB in notifications.
          default: 20
          selector:
            number:
              min: 5
              max: 60
              step: 1
              unit_of_measurement: seconds
              mode: slider

        camera_labels:
          name: Camera Names in GIF
          description: >
            Show the camera name in the corner of the GIF. Skipped
            automatically if Home Assistant's ffmpeg can't draw text.
          default: true
          selector:
            boolean: {}

        pre_padding:
          name: Lead-in (seconds)
          description: >
            Seconds of recording to show before the object first appears
            (and before it reappears after being out of view).
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: seconds
              mode: slider

        post_padding:
          name: Lead-out (seconds)
          description: Seconds of recording to show after each camera loses the object.
          default: 2
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: seconds
              mode: slider

    notification_options:
      name: Notification Options
      icon: mdi:message-image
      collapsed: true
      input:
        title_style:
          name: Notification Title
          description: >
            "What was detected" e.g. "Zach detected". "Cameras" e.g.
            "Front Door Cam → Back Door Cam". "Advanced" uses Frigate's GenAI
            title (Frigate 0.17+ with review -> genai enabled), with ⚠️/🚨
            if Frigate rates it as a potential threat, or what was detected
            if no summary arrived in time. "None" sends no title.
          default: subject
          selector:
            select:
              options:
                - label: What was detected
                  value: subject
                - label: Cameras
                  value: cameras
                - label: Advanced (GenAI title)
                  value: summary
                - label: None
                  value: none

        message_style:
          name: Notification Text
          description: >
            "Cameras" lists the cameras in the order the object reached them,
            with the journey length, e.g. "Front Door Cam → Back Door Cam
            (0:05)". "What was detected" e.g. "Zach was detected".
            "Advanced" uses Frigate's GenAI short summary, or the cameras if
            no summary arrived in time. "None" sends no text.


            With "Advanced", every camera's review in the journey can get its
            own GenAI summary. The one Frigate rates as the biggest potential
            threat is used, or the first camera's if they are rated the same,
            unless "Combine Summaries with AI" below is set.
          default: cameras
          selector:
            select:
              options:
                - label: Cameras
                  value: cameras
                - label: What was detected
                  value: subject
                - label: Advanced (GenAI short summary)
                  value: summary
                - label: None
                  value: none

        ai_task:
          name: Combine Summaries with AI (optional)
          description: >
            An AI Task entity (Settings -> Devices & services, e.g. Ollama,
            OpenAI or Google Generative AI) that combines the GenAI summaries
            of a journey's cameras into one title, summary and description,
            in the order things happened and using the recognized names.
            Only the summaries' text is sent, no images. Used when two or
            more cameras have a summary; if it fails, the summary Frigate
            rates as the biggest potential threat is used instead. Leave
            blank to turn off.
          default: ""
          selector:
            entity:
              filter:
                domain: ai_task

        ai_instructions:
          name: Extra AI Instructions (optional)
          description: >
            Anything else the AI should know when combining the summaries,
            e.g. "Zach is the homeowner. Gerry and Sue are neighbours."
          default: ""
          selector:
            text:
              multiline: true

        buttons:
          name: Action Buttons
          description: >
            Buttons to show on the notification (Android shows at most 3).
            "View Clip" and "Open in Frigate" open the first camera's review.
          default: [gif, clip, frigate]
          selector:
            select:
              multiple: true
              sort: false
              options:
                - label: View GIF
                  value: gif
                - label: View Clip
                  value: clip
                - label: Open in Frigate (needs the External Frigate URL)
                  value: frigate

        sublabel:
          name: Show Recognized Names
          description: >
            Use the names of people Frigate recognized (face recognition)
            instead of the object label, e.g. "Zach detected" instead of
            "Person detected".
          default: true
          selector:
            boolean: {}

        append:
          name: Append "Camera"
          description: Add "Camera" to the end of camera names.
          default: false
          selector:
            boolean: {}

        expand:
          name: Expand "Cam" to "Camera"
          default: false
          selector:
            boolean: {}

        tap_action:
          name: Tap Action
          description: What opens when the notification itself is tapped.
          default: gif
          selector:
            select:
              options:
                - label: The journey GIF
                  value: gif
                - label: Review in Frigate (falls back to the clip if no Frigate URL is set)
                  value: frigate
                - label: Event clip
                  value: clip

        notification_timeout:
          name: Notification Timeout (minutes)
          description: Dismiss the notification automatically after this long.
          default: 60
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: minutes
              mode: box

    advanced_options:
      name: Advanced Options
      icon: mdi:cog
      collapsed: true
      input:
        base_url:
          name: External Home Assistant URL
          description: >
            Public URL of Home Assistant including the port if needed (e.g.
            https://ha.example.com). Used by the "View GIF" and "View Clip"
            buttons. Leave blank to open them inside the companion app.
          default: ""
          selector:
            text: {}

        frigate_url:
          name: External Frigate URL
          description: >
            Public URL of the Frigate UI (e.g. https://frigate.example.com).
            Used for the "Open in Frigate" button. Leave blank to hide that
            button.
          default: ""
          selector:
            text: {}

        mqtt_topic:
          name: Frigate Reviews MQTT Topic
          description: Change only if you set a custom MQTT topic_prefix in Frigate.
          default: frigate/reviews
          selector:
            text: {}

        shell_service:
          name: Shell Command Action
          description: >
            The shell_command action that runs frigate_vision_multicam.py.
          default: shell_command.frigate_vision_multicam
          selector:
            text: {}

        history:
          name: Record History (for the dashboard)
          description: >
            Record each journey, with its GIF and Frigate's GenAI summary, for
            the Frigate Vision history dashboard (see the README for its
            one-time setup). The GenAI summary is recorded even when the
            notification doesn't use it. Does nothing if the dashboard isn't
            set up.
          default: true
          selector:
            boolean: {}

# ---------------------------------------------------------------------------
# Every review that matches the filters starts a run. If another run of this
# automation is already following a journey, the new run asks it (with a
# frigate_vision_multicam_join event) whether the review belongs to that
# journey. If it does, that run takes the review over and this one stops;
# otherwise this run starts a journey of its own.
#
# The run that owns a journey listens to every review on the topic, adds the
# ones that link to it, and once they have all ended and the link gap has
# passed, has frigate_vision_multicam.py cut their recordings together into
# one GIF.
# ---------------------------------------------------------------------------
mode: parallel
max: 100
max_exceeded: silent

triggers:
  - trigger: mqtt
    topic: !input mqtt_topic

variables:
  input_cameras: !input cameras
  input_severity: !input severity
  input_labels: !input labels
  input_cooldown: !input cooldown

  watched_cameras: >
    {{ input_cameras | map('replace', 'camera.', '') | list }}
  # The Labels checklist in its own order, which decides what a journey
  # follows when a review has more than one of them. Labels saved from
  # before it was a checklist go last.
  label_order: [person, car, truck, motorcycle, bicycle, package, dog, cat, bird, deer, horse, bear]
  labels: >
    {% set picked = input_labels | map('lower') | list %}
    {{ label_order | select('in', picked) | list + picked | reject('in', label_order) | list }}

  should_start: >
    {% macro matches(r) -%}
      {%- set d = r.data | default({}) -%}
      {%- set found = (d.objects | default([]) + d.audio | default([]))
            | map('replace', '-verified', '') | map('lower') | list -%}
      {%- set cam_ok = (r.camera | default('') | lower | replace('-', '_')) in watched_cameras -%}
      {%- set sev_ok = r.severity | default('') in input_severity -%}
      {%- set label_ok = found | select('in', labels) | list | count > 0 -%}
      {{- cam_ok and sev_ok and label_ok -}}
    {%- endmacro %}
    {% set p = trigger.payload_json | default({}) %}
    {% if p.type | default('') == 'new' %}
      {{ matches(p.after) == 'True' }}
    {% elif p.type | default('') == 'update' %}
      {{ matches(p.after) == 'True' and matches(p.before) != 'True' }}
    {% else %}
      {{ false }}
    {% endif %}

  cooldown_seconds: >
    {{ (input_cooldown.days | default(0)) * 86400
       + (input_cooldown.hours | default(0)) * 3600
       + (input_cooldown.minutes | default(0)) * 60
       + (input_cooldown.seconds | default(0)) }}

conditions:
  - alias: At least one label is selected
    condition: template
    value_template: "{{ labels | count > 0 }}"
  - condition: template
    value_template: "{{ should_start }}"
  - alias: Cooldown since the last notification
    condition: template
    value_template: >
      {{ cooldown_seconds == 0
         or this.attributes.last_triggered is none
         or now().timestamp() - as_timestamp(this.attributes.last_triggered, 0) >= cooldown_seconds }}

actions:

  # ── Resolve inputs ─────────────────────────────────────────────────────────
  - variables:
      input_devices: !input notify_device
      input_link_gap: !input link_gap
      input_link_detections: !input link_detections
      input_max_journey: !input max_journey
      input_frigate_api_url: !input frigate_api_url
      input_gif_shape: !input gif_shape
      input_gif_size: !input gif_size
      input_gif_background: !input gif_background
      input_gif_fps: !input gif_fps
      input_gif_speed: !input gif_speed
      input_gif_max_length: !input gif_max_length
      input_camera_labels: !input camera_labels
      input_recording_delay: !input recording_delay
      input_render_timeout: !input render_timeout
      input_title_style: !input title_style
      input_message_style: !input message_style
      input_genai_timeout: !input genai_timeout
      input_ai_task: !input ai_task
      input_ai_instructions: !input ai_instructions
      use_genai: "{{ 'summary' in [input_title_style, input_message_style] }}"
      input_history: !input history
      # The history records the GenAI summary even when the notification
      # doesn't use it
      collect_genai: "{{ use_genai or input_history }}"
      input_buttons: !input buttons
      input_sublabel: !input sublabel
      input_append: !input append
      input_expand: !input expand
      input_tap_action: !input tap_action
      input_notification_timeout: !input notification_timeout
      input_base_url: !input base_url
      input_frigate_url: !input frigate_url
      input_shell_service: !input shell_service
      input_pre_padding: !input pre_padding
      input_post_padding: !input post_padding

      automation_id: "{{ this.entity_id }}"
      review: "{{ trigger.payload_json.after }}"
      max_journey_seconds: >
        {{ (input_max_journey.hours | default(0)) * 3600
           + (input_max_journey.minutes | default(0)) * 60
           + (input_max_journey.seconds | default(0)) }}

  # ── Join a journey in progress ─────────────────────────────────────────────
  # Only needed if another run is going. Keep following this review's own
  # updates while asking, so none are missed if it ends up starting a journey.
  - if:
      - condition: template
        value_template: "{{ this.attributes.current | default(0) | int(0) > 0 }}"
    then:
      - variables:
          join_deadline: "{{ now().timestamp() + 2 }}"
          joined: false
      - repeat:
          until:
            - condition: template
              value_template: "{{ joined or now().timestamp() >= join_deadline }}"
          sequence:
            - event: frigate_vision_multicam_join
              event_data:
                automation: "{{ automation_id }}"
                review: "{{ review }}"
            - wait_for_trigger:
                - trigger: event
                  event_type: frigate_vision_multicam_joined
                  event_data:
                    automation: "{{ automation_id }}"
                    review_id: "{{ review.id }}"
                - trigger: mqtt
                  topic: !input mqtt_topic
                  value_template: "{{ value_json.after.id }}"
                  payload: "{{ review.id }}"
              timeout:
                seconds: 1
              continue_on_timeout: true
            - variables:
                joined: "{{ wait.trigger is not none and wait.trigger.event is defined }}"
                review: >
                  {% set t = wait.trigger %}
                  {{ t.payload_json.after
                     if t is not none and t.event is not defined
                        and t.payload_json.type | default('') in ['new', 'update', 'end']
                     else review }}
      - if:
          - condition: template
            value_template: "{{ joined }}"
        then:
          - stop: Joined a journey already in progress

  # ── New journey ────────────────────────────────────────────────────────────
  - variables:
      journey_id: "{{ review.id }}"
      # The kind of object this journey follows: the first of the selected
      # labels found in the review
      label: >
        {% set d = review.data | default({}) %}
        {% set found = (d.objects | default([]) + d.audio | default([]))
             | map('replace', '-verified', '') | map('lower') | list %}
        {{ labels | select('in', found) | first }}
      members: "{{ [review] }}"
      started_at: "{{ now().timestamp() }}"
      last_end_at: "{{ now().timestamp() }}"

      notify_services: >
        {% set ns = namespace(services=[]) %}
        {% for device in input_devices %}
          {% set ns.services = ns.services
               + ['notify.mobile_app_' ~ (device_attr(device, 'name') | slugify)] %}
        {% endfor %}
        {{ ns.services }}

      first_camera: "{{ review.camera }}"
      first_event_id: "{{ (review.data.detections | default([]) | first) or '' }}"
      # Lower-case the scheme: Android won't open an "Https://" link
      base_url: >
        {% set b = input_base_url | trim | regex_replace('/+$', '') %}
        {{ b.split('://')[0] | lower ~ '://' ~ b.split('://', 1)[1] if '://' in b else b }}
      frigate_gif_url: /api/frigate/notifications/{{ journey_id }}/review_preview.gif
      frigate_api: "{{ input_frigate_api_url | trim | regex_replace('/+$', '') }}"
      thumbnail_url: >
        {% if first_event_id %}/api/frigate/notifications/{{ first_event_id }}/thumbnail.jpg
        {% else %}/api/frigate/notifications/{{ journey_id }}/{{ first_camera }}/review_thumbnail.webp{% endif %}
      clip_url: >
        {% if first_event_id %}{{ base_url }}/api/frigate/notifications/{{ first_event_id }}/{{ first_camera }}/clip.mp4{% endif %}
      frigate_review_url: >
        {% set f = input_frigate_url | trim | regex_replace('/+$', '') %}
        {% if f %}{{ f }}/review?id={{ journey_id }}{% endif %}
      zero_width_space: "\u200B"

      # State for the loop below
      #   stage: active -> ended -> [render -> poll ->] summary -> done
      # "hold" waits until hold_until (picking up GenAI summaries meanwhile),
      # then moves on to then_stage.
      stage: active
      gif_url: ""
      # GenAI summaries of the journey's reviews: [{id, start, threat, meta}]
      summaries: []
      # Which cameras and severities Frigate summarises ("<camera>@alert"),
      # read from Frigate's config by the script, and the ids of the reviews
      # whose summaries the notification waits for
      genai_known: false
      genai_reviews: []
      genai_expected: []
      hold_until: 0
      then_stage: ""
      ended_at: 0
      job: ""
      render_status: skipped
      render_url: ""
      render_error: ""
      render_deadline: 0

  # ── Journey loop ───────────────────────────────────────────────────────────
  # Each pass does whatever the current stage is waiting on. Nothing is sent
  # until the loop is done.
  - repeat:
      until:
        - condition: template
          value_template: "{{ stage == 'done' }}"
      sequence:

        - choose:

            # Journey in progress: add reviews that link to it and follow them
            # until they have all ended and the link gap has passed
            - conditions: "{{ stage == 'active' }}"
              sequence:
                - variables:
                    any_active: "{{ members | selectattr('end_time', 'none') | list | count > 0 }}"
                    wait_seconds: >
                      {% set max_left = started_at + max_journey_seconds - now().timestamp() %}
                      {% set gap_left = last_end_at + input_link_gap - now().timestamp() %}
                      {{ [max_left if any_active else [gap_left, max_left] | min, 0] | max | round(1) }}
                - if:
                    - condition: template
                      value_template: "{{ wait_seconds <= 0 }}"
                  then:
                    - variables:
                        stage: ended
                  else:
                    - wait_for_trigger:
                        - trigger: mqtt
                          topic: !input mqtt_topic
                        - trigger: event
                          event_type: frigate_vision_multicam_join
                          event_data:
                            automation: "{{ automation_id }}"
                      timeout:
                        seconds: "{{ wait_seconds }}"
                      continue_on_timeout: true
                    - variables:
                        is_join: "{{ wait.trigger is not none and wait.trigger.event is defined }}"
                        msg_type: >
                          {% if wait.trigger is none %}none
                          {% elif is_join %}join
                          {% else %}{{ wait.trigger.payload_json.type | default('none') }}{% endif %}
                        r: >
                          {% if is_join %}{{ wait.trigger.event.data.review | default({}) }}
                          {% elif msg_type in ['new', 'update', 'end'] %}{{ wait.trigger.payload_json.after | default({}) }}
                          {% else %}{}{% endif %}
                        known: "{{ r.id is defined and r.id in members | map(attribute='id') | list }}"
                        linkable: >
                          {% if r.id is not defined or known or msg_type not in ['new', 'update', 'join'] %}
                            {{ false }}
                          {% else %}
                            {% set d = r.data | default({}) %}
                            {% set found = (d.objects | default([]) + d.audio | default([]))
                                 | map('replace', '-verified', '') | map('lower') | list %}
                            {% set cam_ok = (r.camera | default('') | lower | replace('-', '_')) in watched_cameras %}
                            {% set sev_ok = input_link_detections or r.severity | default('') in input_severity %}
                            {% set first_start = members | map(attribute='start_time') | min %}
                            {% set last_end = members | map(attribute='end_time') | reject('none') | list | max | default(first_start) %}
                            {% set start = r.start_time | float(0) %}
                            {% set time_ok = start >= first_start - input_link_gap
                                 and start <= first_start + max_journey_seconds
                                 and (any_active or start <= last_end + input_link_gap) %}
                            {% set names = members | map(attribute='data.sub_labels') | map('default', [])
                                 | sum(start=[]) | map('string') | reject('eq', '') | list %}
                            {% set r_names = d.sub_labels | default([]) | map('string') | reject('eq', '') | list %}
                            {% set names_ok = not names or not r_names or r_names | select('in', names) | list | count > 0 %}
                            {{ cam_ok and sev_ok and label in found and time_ok and names_ok }}
                          {% endif %}
                        members: >
                          {% if known and msg_type in ['new', 'update', 'end'] %}
                            {{ members | rejectattr('id', 'eq', r.id) | list + [r] }}
                          {% elif linkable %}
                            {{ members + [r] }}
                          {% else %}
                            {{ members }}
                          {% endif %}
                        last_end_at: >
                          {{ now().timestamp() if (known or linkable) and msg_type == 'end' else last_end_at }}
                        summaries: >
                          {% set p = wait.trigger.payload_json | default({})
                               if wait.trigger is not none else {} %}
                          {% set a = p.after | default({}) %}
                          {% set m = members | selectattr('id', 'eq', a.id | default('')) | list %}
                          {% set meta = (a.data | default({})).metadata | default({}, true) %}
                          {% if collect_genai and p.type | default('') == 'genai' and m and meta %}
                            {{ summaries | rejectattr('id', 'eq', a.id) | list
                               + [{'id': a.id, 'start': m[0].start_time, 'meta': meta,
                                   'threat': meta.potential_threat_level | default(0, true) | int(0)}] }}
                          {% else %}
                            {{ summaries }}
                          {% endif %}
                        stage: >
                          {{ 'ended' if wait.trigger is none
                             and now().timestamp() >= started_at + max_journey_seconds else 'active' }}
                    - if:
                        - condition: template
                          value_template: "{{ is_join and (known or linkable) }}"
                      then:
                        - event: frigate_vision_multicam_joined
                          event_data:
                            automation: "{{ automation_id }}"
                            review_id: "{{ r.id }}"

            # Wait until hold_until, then go on to then_stage, picking up
            # Frigate's GenAI summaries meanwhile.
            - conditions: "{{ stage == 'hold' }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ collect_genai }}"
                  then:
                    - wait_for_trigger:
                        - trigger: mqtt
                          topic: !input mqtt_topic
                          value_template: "{{ value_json.type }}"
                          payload: genai
                      timeout:
                        seconds: "{{ [hold_until - now().timestamp(), 0] | max | round(1) }}"
                      continue_on_timeout: true
                    - variables:
                        summaries: >
                          {% set p = wait.trigger.payload_json | default({})
                               if wait.trigger is not none else {} %}
                          {% set a = p.after | default({}) %}
                          {% set m = members | selectattr('id', 'eq', a.id | default('')) | list %}
                          {% set meta = (a.data | default({})).metadata | default({}, true) %}
                          {% if collect_genai and p.type | default('') == 'genai' and m and meta %}
                            {{ summaries | rejectattr('id', 'eq', a.id) | list
                               + [{'id': a.id, 'start': m[0].start_time, 'meta': meta,
                                   'threat': meta.potential_threat_level | default(0, true) | int(0)}] }}
                          {% else %}
                            {{ summaries }}
                          {% endif %}
                  else:
                    - delay:
                        seconds: "{{ [hold_until - now().timestamp(), 0] | max | round(1) }}"
                - variables:
                    stage: >
                      {% set missing = genai_expected
                           | reject('in', summaries | map(attribute='id') | list) | list %}
                      {{ then_stage if now().timestamp() >= hold_until - 0.05
                         or (then_stage == 'done' and not missing)
                         else 'hold' }}

            # Journey over: wait for Frigate to save the recordings, then build
            # the journey GIF. Frigate's own GIF of the first camera is the
            # fallback if it can't be built (or with no Frigate URL, once
            # Frigate has made it, ~10s after the review).
            - conditions: "{{ stage == 'ended' }}"
              sequence:
                - variables:
                    ended_at: "{{ now().timestamp() }}"
                    gif_url: "{{ frigate_gif_url }}"
                    hold_until: >
                      {{ now().timestamp() + input_recording_delay if frigate_api
                         else [now().timestamp(), last_end_at + 10] | max }}
                    then_stage: "{{ 'render' if frigate_api else 'summary' }}"
                    stage: hold

            # Have the script build the journey GIF in the background
            - conditions: "{{ stage == 'render' }}"
              sequence:
                - variables:
                    job: >
                      {{ journey_id }}-{{ '%04x%04x' | format(range(65536) | random, range(65536) | random) }}
                    render_args: >
                      render job={{ job }} url={{ frigate_api }}
                      size={{ input_gif_size | int }} shape={{ input_gif_shape }}
                      background={{ input_gif_background }}
                      fps={{ input_gif_fps | int }} speed={{ input_gif_speed }}
                      max_length={{ input_gif_max_length }}
                      pre={{ input_pre_padding }} post={{ input_post_padding }}
                      labels={{ 1 if input_camera_labels else 0 }}
                      keep_hours={{ [48, (input_notification_timeout / 60) | round(0, 'ceil') | int + 1] | max }}
                      {% for m in members | sort(attribute='start_time') -%}
                        review={{ m.camera }}@{{ m.start_time }}@{{ m.end_time if m.end_time is not none else now().timestamp() }}
                        {%- for d in m.data.detections | default([]) %}
                          {%- set seen = d | string | regex_replace('-.*$', '') | float(0) %}
                          {%- if seen > 0 %}@{{ seen }}{% endif %}
                        {%- endfor %}{{ ' ' }}
                      {%- endfor %}
                    render_response: {}
                - action: "{{ input_shell_service }}"
                  continue_on_error: true
                  data:
                    args: "{{ render_args | trim }}"
                  response_variable: render_response
                - variables:
                    render_status: >
                      {{ (render_response.stdout | default('')
                          | regex_findall('"status": "(\\w+)"') | first | default('failed'))
                         | replace('started', 'running') }}
                    render_error: >
                      {{ render_response.stdout | default('')
                         | regex_findall('"error": "([^"]*)"') | first
                         | default(render_response.stderr | default('the shell_command did not run', true)) }}
                    genai_known: >
                      {{ render_response.stdout | default('') | regex_findall('"genai": "') | count > 0 }}
                    genai_reviews: >
                      {{ (render_response.stdout | default('')
                          | regex_findall('"genai": "([^"]*)"') | first | default('')).split() }}
                    render_deadline: "{{ now().timestamp() + input_render_timeout }}"
                    hold_until: "{{ now().timestamp() + 3 }}"
                    then_stage: poll
                    stage: "{{ 'hold' if render_status == 'running' else 'poll' }}"

            # Check on the GIF every few seconds until it's ready
            - conditions: "{{ stage == 'poll' }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ render_status == 'running' }}"
                  then:
                    - variables:
                        status_response: {}
                    - action: "{{ input_shell_service }}"
                      continue_on_error: true
                      data:
                        args: status job={{ job }}
                      response_variable: status_response
                    - variables:
                        render_status: >
                          {{ status_response.stdout | default('')
                             | regex_findall('"status": "(\\w+)"') | first | default('running') }}
                        render_url: >
                          {{ status_response.stdout | default('')
                             | regex_findall('"url": "([^"]+)"') | first | default('') }}
                        render_error: >
                          {{ status_response.stdout | default('')
                             | regex_findall('"error": "([^"]*)"') | first | default('') }}
                - if:
                    - condition: template
                      value_template: >
                        {{ render_status == 'running' and now().timestamp() < render_deadline }}
                  then:
                    - variables:
                        hold_until: "{{ now().timestamp() + 3 }}"
                        then_stage: poll
                        stage: hold
                  else:
                    - if:
                        - condition: template
                          value_template: "{{ render_status != 'done' or not render_url }}"
                      then:
                        - action: system_log.write
                          data:
                            level: warning
                            logger: blueprints.frigate_vision_multicam
                            message: >
                              Frigate Vision could not build the GIF for journey {{ journey_id }}
                              ({{ 'timed out' if render_status == 'running' else render_error }}),
                              keeping Frigate's GIF of the first camera. The script's log
                              is /config/frigate_vision/jobs/{{ job }}.log
                    - variables:
                        gif_url: >
                          {{ render_url if render_status == 'done' and render_url else gif_url }}
                        stage: summary

            # GIF ready: wait for the GenAI summaries still to come. Only the
            # reviews Frigate summarises are waited for: per its config if
            # the script could read it, otherwise alerts (Frigate's default).
            - conditions: "{{ stage == 'summary' }}"
              sequence:
                - variables:
                    genai_expected: >
                      {% set ns = namespace(ids=[]) %}
                      {% for m in members %}
                        {% set summarised = ((m.camera ~ '@' ~ m.severity) in genai_reviews)
                             if genai_known else m.severity == 'alert' %}
                        {% if summarised %}{% set ns.ids = ns.ids + [m.id] %}{% endif %}
                      {% endfor %}
                      {{ ns.ids if collect_genai else [] }}
                    hold_until: "{{ ended_at + input_genai_timeout }}"
                    then_stage: done
                    stage: >
                      {% set missing = genai_expected
                           | reject('in', summaries | map(attribute='id') | list) | list %}
                      {{ 'hold' if missing and now().timestamp() < ended_at + input_genai_timeout
                         else 'done' }}

          default:
            - variables:
                stage: done

  # ── Notify ─────────────────────────────────────────────────────────────────
  # Everything is in: send the one notification, and record the journey for
  # the history dashboard.
  - variables:
      # Cameras in the order the object reached them, and the names of
      # the people recognized along the way
      path: >
        {% set ns = namespace(cams=[]) %}
        {% for m in members | sort(attribute='start_time') %}
          {% if m.camera not in ns.cams %}{% set ns.cams = ns.cams + [m.camera] %}{% endif %}
        {% endfor %}
        {{ ns.cams }}
      person_names: >
        {% set ns = namespace(names=[]) %}
        {% if label == 'person' %}
          {% for m in members %}
            {% set others = m.data.objects | default([]) | map('replace', '-verified', '')
                 | reject('in', ['person', 'face']) | list %}
            {% if not others %}
              {% set ns.names = ns.names + (m.data.sub_labels | default([]) | map('string') | list) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.names | reject('eq', '') | unique | list }}
      # The GenAI summary to show: the one rated the biggest potential
      # threat, or the first camera's if they are rated the same
      summary_pick: >
        {{ summaries | sort(attribute='start') | sort(attribute='threat', reverse=true)
           | first | default({}) }}
      # Set by the AI Task below, if it's used
      ai_combined: {}

  # Optionally have an AI Task combine the cameras' GenAI summaries into one,
  # in the order things happened. Only their text is sent. If it fails, the
  # summary picked above is used.
  - if:
      - condition: template
        value_template: >
          {{ input_ai_task not in ['', none] and collect_genai and summaries | count > 1 }}
    then:
      - variables:
          ai_response: {}
          ai_prompt: >
            {% set names = person_names %}
            {% set rules = [
                 'You are writing one home security notification for an event that several cameras saw, one after another. Below is the AI summary of each camera\'s footage, in the order they happened. Combine them into one account of the whole event, from start to finish.',
                 '',
                 'Rules:',
                 '- Use only what the summaries say. Do not add details, guess at intentions, or mention cameras, footage, summaries or AI. Places (the driveway, the front door) are fine.',
                 '- Treat it as one continuous event: the same ' ~ (label | replace('_', ' ') or 'subject') ~ ' moving from place to place, unless the summaries clearly describe more than one.',
                 '- Face recognition identified: ' ~ names | join(', ') ~ '. Call them by name, even where a summary says "unidentified person".'
                   if names else
                 '- Nobody was recognized. Refer to people generically (e.g. "a person"), never as "unidentified" or "unknown".',
                 '- title: a short headline, under 8 words.',
                 '- summary: 1-2 sentences, under 40 words.',
                 '- scene: a short paragraph describing what happened, in order.'] %}
            {% if input_ai_instructions | trim %}
              {% set rules = rules + ['', 'Additional context:', input_ai_instructions | trim] %}
            {% endif %}
            {% set ns = namespace(parts=[rules | join('\n')]) %}
            {% set first = summaries | map(attribute='start') | min %}
            {% for s in summaries | sort(attribute='start') %}
              {% set m = members | selectattr('id', 'eq', s.id) | first | default({}) %}
              {% set cam = m.camera | default('') | replace('_', ' ') | replace('-', ' ') | title %}
              {% set secs = (s.start - first) | round(0) | int %}
              {% set c = namespace(lines=['Camera ' ~ loop.index ~ ': ' ~ cam
                   ~ ' (' ~ '%d:%02d' | format(secs // 60, secs % 60) ~ ' into the event)']) %}
              {% for key, heading in [('title', 'Title'), ('shortSummary', 'Summary'), ('scene', 'Details')] %}
                {% if s.meta[key] | default('', true) is string and s.meta[key] | default('', true) %}
                  {% set c.lines = c.lines + [heading ~ ': ' ~ s.meta[key]] %}
                {% endif %}
              {% endfor %}
              {% for key, heading in [('observations', 'Observations'), ('other_concerns', 'Concerns')] %}
                {% set items = s.meta[key] | default([], true) %}
                {% set items = [items] if items is string else items %}
                {% if items %}
                  {% set c.lines = c.lines + [heading ~ ':'] + (items | map('regex_replace', '^', '- ') | list) %}
                {% endif %}
              {% endfor %}
              {% set ns.parts = ns.parts + [c.lines | join('\n')] %}
            {% endfor %}
            {{ ns.parts | join('\n\n') }}
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Frigate Vision journey summary
          entity_id: "{{ input_ai_task }}"
          instructions: "{{ ai_prompt }}"
          structure:
            title:
              description: A short headline for the whole event, under 8 words.
              required: true
              selector:
                text:
            summary:
              description: What happened from start to finish, in 1-2 sentences under 40 words.
              required: true
              selector:
                text:
            scene:
              description: A short paragraph describing what happened, in order.
              required: false
              selector:
                text:
                  multiline: true
        response_variable: ai_response
      - variables:
          ai_combined: >
            {% set d = ai_response.data | default({}) %}
            {{ d if d is mapping and d.title | default('', true) is string
                    and d.title | default('', true) and d.summary | default('', true) is string
                    and d.summary | default('', true) else {} }}

  - variables:
      # Frigate's GenAI calls anyone it didn't recognize on its camera an
      # "unidentified person", even when they were recognized on another.
      # Use the recognized name instead, or just "person" if there isn't one.
      summary: >
        {%- macro clean(t, names) -%}
          {%- set adj = '(?:unidentified|unknown|unrecogni[sz]ed|unfamiliar)' -%}
          {%- set nouns = ['person', 'people', 'individual', 'individuals', 'man', 'men',
               'woman', 'women', 'figure', 'figures', 'visitor', 'visitors'] -%}
          {%- set noun = '(?:' ~ nouns | join('|') ~ ')' -%}
          {%- set ns = namespace(t=t | string) -%}
          {%- if names | count == 1 and names[0] | lower not in ns.t | lower -%}
            {%- set ns.t = ns.t | regex_replace('\\b(?:(?:an?|the|one) )?' ~ adj
                 ~ ' (?:person|individual|man|woman|figure|visitor)\\b',
                 names[0] | replace('\\', '\\\\'), true) -%}
          {%- endif -%}
          {%- set ns.t = ns.t | regex_replace('\\b(a)n ' ~ adj ~ ' (?=' ~ noun ~ '\\b)', '\\1 ', true) -%}
          {%- for n in nouns -%}
            {%- set ns.t = ns.t | regex_replace('\\b(?:Unidentified|Unknown|Unrecogni[sz]ed|Unfamiliar) '
                 ~ n ~ '\\b', n | capitalize) -%}
          {%- endfor -%}
          {{- ns.t | regex_replace('\\b' ~ adj ~ ' (?=' ~ noun ~ '\\b)', '', true) -}}
        {%- endmacro -%}
        {% set meta = summary_pick.meta | default({}) %}
        {% if ai_combined %}
          {% set ns = namespace(observations=[], concerns=[]) %}
          {% for m in summaries | sort(attribute='start') | map(attribute='meta') %}
            {% set o = m.observations | default([], true) %}
            {% set ns.observations = ns.observations + ([o] if o is string else o | list) %}
            {% set o = m.other_concerns | default([], true) %}
            {% set ns.concerns = ns.concerns + ([o] if o is string else o | list) %}
          {% endfor %}
          {% set meta = {
               'title': ai_combined.title,
               'shortSummary': ai_combined.summary,
               'scene': ai_combined.scene | default('', true) if ai_combined.scene | default('', true) is string else '',
               'observations': ns.observations | unique | list,
               'other_concerns': ns.concerns | unique | list,
               'potential_threat_level': summaries | map(attribute='threat') | max } %}
        {% endif %}
        {% set ns = namespace(d={}) %}
        {% for key, value in (meta if meta is mapping else {}).items() %}
          {% if value is string %}
            {% set value = clean(value, person_names) %}
          {% elif key in ['observations', 'other_concerns'] and value is iterable and value is not mapping %}
            {% set items = namespace(list=[]) %}
            {% for item in value %}
              {% set items.list = items.list + [clean(item, person_names) if item is string else item] %}
            {% endfor %}
            {% set value = items.list %}
          {% endif %}
          {% set ns.d = dict(ns.d, **{key: value}) %}
        {% endfor %}
        {{ ns.d }}

  - if:
      - condition: template
        value_template: "{{ notify_services | count > 0 }}"
    then:
      - variables:
          n_cameras: >
            {% set ns = namespace(names=[]) %}
            {% for cam in path %}
              {% set name = cam | replace('_', ' ') | replace('-', ' ') | title %}
              {% if input_expand %}
                {% set name = name | regex_replace('(?i)\\bcam\\b', 'Camera') %}
              {% endif %}
              {% set ns.names = ns.names + [name ~ (' Camera' if input_append else '')] %}
            {% endfor %}
            {{ ns.names | join(' → ') }}
          n_group: >
            {% set name = first_camera | replace('_', ' ') | replace('-', ' ') | title %}
            {% if input_expand %}
              {% set name = name | regex_replace('(?i)\\bcam\\b', 'Camera') %}
            {% endif %}
            {{ name ~ (' Camera' if input_append else '') }}
          n_subject: >
            {% set names = person_names if input_sublabel else [] %}
            {% set items = names if names else [label | replace('_', ' ')] %}
            {% if items | count > 1 %}
              {% set text = items[:-1] | join(', ') ~ ' and ' ~ items[-1] %}
            {% else %}
              {% set text = items[0] | default('activity', true) %}
            {% endif %}
            {{ text[:1] | upper ~ text[1:] }}
          n_duration: >
            {% if gif_url %}
              {% set start = members | map(attribute='start_time') | min %}
              {% set end = members | map(attribute='end_time') | reject('none') | list | max | default(start) %}
              {% set s = (end - start) | round(0) | int %}
              {{ '%d:%02d' | format(s // 60, s % 60) }}
            {% endif %}
          n_threat: "{{ summary.potential_threat_level | default(0, true) | int(0) }}"
          n_title: >
            {% if input_title_style == 'cameras' %}{{ n_cameras }}
            {% elif input_title_style == 'summary' %}
              {% set t = summary.title | default('', true) or n_subject ~ ' detected' %}
              {{ ('🚨 ' if n_threat >= 2 else '⚠️ ' if n_threat == 1 else '') ~ t }}
            {% else %}{{ n_subject }} detected{% endif %}
          n_message: >
            {% if input_message_style == 'subject' %}{{ n_subject }} was detected
            {% elif input_message_style == 'summary'
                 and summary.shortSummary | default('', true) %}{{ summary.shortSummary }}
            {% else %}{{ n_cameras }}{{ ' (' ~ n_duration ~ ')' if n_duration else '' }}{% endif %}
          n_gif_open_url: "{{ base_url ~ gif_url if gif_url else '' }}"
          n_tap_url: >
            {% if input_tap_action == 'gif' and n_gif_open_url %}{{ n_gif_open_url }}
            {% elif input_tap_action in ['gif', 'frigate'] and frigate_review_url %}{{ frigate_review_url }}
            {% else %}{{ clip_url or frigate_review_url }}{% endif %}
          n_buttons: >
            {% set b = [] %}
            {% if n_gif_open_url and 'gif' in input_buttons %}
              {% set b = b + [{'action': 'URI', 'title': 'View GIF', 'uri': n_gif_open_url}] %}
            {% endif %}
            {% if clip_url and 'clip' in input_buttons %}
              {% set b = b + [{'action': 'URI', 'title': 'View Clip', 'uri': clip_url}] %}
            {% endif %}
            {% if frigate_review_url and 'frigate' in input_buttons %}
              {% set b = b + [{'action': 'URI', 'title': 'Open in Frigate', 'uri': frigate_review_url}] %}
            {% endif %}
            {{ b[:3] }}
          n_service_data: >
            {% set image = gif_url or thumbnail_url %}
            {% set data = {
                 'tag': journey_id,
                 'group': n_group,
                 'channel': n_group ~ ' Notifications',
                 'timeout': (input_notification_timeout * 60) | int,
                 'ttl': 0,
                 'priority': 'high',
                 'alert_once': true,
                 'clickAction': n_tap_url,
                 'url': n_tap_url,
                 'image': image,
                 'attachment': {'url': image},
                 'push': {'interruption-level': 'active'},
                 'actions': n_buttons } %}
            {% set d = {'message': zero_width_space if input_message_style == 'none' else n_message,
                        'data': data} %}
            {{ d if input_title_style == 'none' else dict(d, title=n_title) }}
      - repeat:
          for_each: "{{ notify_services }}"
          sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data: "{{ n_service_data }}"

  - if:
      - condition: template
        value_template: "{{ input_history and gif_url != '' }}"
    then:
      - event: frigate_vision_history
        event_data:
          id: "{{ journey_id }}"
          cameras: "{{ path }}"
          severity: >
            {{ 'alert' if members | selectattr('severity', 'eq', 'alert') | list
               else 'detection' }}
          start: "{{ members | map(attribute='start_time') | min }}"
          end: >
            {{ members | map(attribute='end_time') | reject('none') | list
               | max | default(0) }}
          objects: >
            {% set ns = namespace(found=[]) %}
            {% for m in members %}
              {% set d = m.data | default({}) %}
              {% set ns.found = ns.found + d.objects | default([]) + d.audio | default([]) %}
            {% endfor %}
            {% set found = ns.found | map('replace', '-verified', '') | unique | list %}
            {{ [label] + found | reject('eq', label) | list if label else found }}
          names: "{{ person_names }}"
          zones: >
            {{ members | map(attribute='data.zones') | map('default', [])
               | sum(start=[]) | unique | list }}
          gif: "{{ gif_url }}"
          # The journey GIF is deleted after keep_hours (see render_args),
          # after which the dashboard shows Frigate's GIF instead
          gif_until: >
            {% set keep_hours = [48, (input_notification_timeout / 60) | round(0, 'ceil') | int + 1] | max %}
            {{ now().timestamp() + (keep_hours - 1) * 3600
               if gif_url != frigate_gif_url else 0 }}
          gif_fallback: "{{ frigate_gif_url }}"
          thumbnail: "{{ thumbnail_url | trim }}"
          clip: "{{ clip_url | trim }}"
          frigate: "{{ frigate_review_url | trim }}"
          title: "{{ summary.title | default('', true) }}"
          summary: "{{ summary.shortSummary | default('', true) }}"
          scene: "{{ summary.scene | default('', true) }}"
          observations: >
            {% set o = summary.observations | default([], true) %}
            {{ [o] if o is string else o | list }}
          concerns: >
            {% set o = summary.other_concerns | default([], true) %}
            {{ [o] if o is string else o | list }}
          threat: "{{ summary.potential_threat_level | default(0, true) | int(0) }}"
          # The cameras' own GenAI summaries the AI Task combined, so the
          # dashboard can show where the combined summary came from
          sources: >
            {% set ns = namespace(list=[]) %}
            {% if ai_combined %}
              {% for s in summaries | sort(attribute='start') %}
                {% set m = members | selectattr('id', 'eq', s.id) | first | default({}) %}
                {% set o = s.meta.observations | default([], true) %}
                {% set c = s.meta.other_concerns | default([], true) %}
                {% set ns.list = ns.list + [{
                     'camera': m.camera | default(''),
                     'start': s.start,
                     'title': s.meta.title | default('', true) | string,
                     'summary': s.meta.shortSummary | default('', true) | string,
                     'scene': s.meta.scene | default('', true) | string,
                     'observations': [o] if o is string else o | list,
                     'concerns': [c] if c is string else c | list,
                     'threat': s.threat }] %}
              {% endfor %}
            {% endif %}
            {{ ns.list }}
