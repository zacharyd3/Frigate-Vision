title: Camera History
views:
  - title: Camera History
    path: camera-history
    icon: mdi:cctv
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Camera History
            heading_style: title
            icon: mdi:cctv
            badges:
              - type: entity
                entity: sensor.frigate_vision_history
                show_icon: true
                show_state: true
                tap_action:
                  action: none
              - type: entity
                entity: script.frigate_vision_clear_history
                show_icon: true
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: script.frigate_vision_clear_history
                  confirmation:
                    text: Clear the camera history? GIFs and clips stay in Frigate.

          # ── Today at a glance ────────────────────────────────────────────
          - type: markdown
            text_only: true
            card_mod:
              style:
                ha-markdown$: |
                  section {
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    gap: 8px;
                    margin: 0 0 10px;
                  }
                  section div {
                    display: flex;
                    flex-direction: column;
                    gap: 2px;
                    padding: 12px 14px;
                    border-radius: 16px;
                    background: var(--card-background-color);
                    border: 1px solid var(--divider-color);
                  }
                  section b {
                    font-size: 26px;
                    font-weight: 600;
                    line-height: 1.1;
                    font-variant-numeric: tabular-nums;
                    color: var(--primary-text-color);
                  }
                  section small {
                    font-size: 12px;
                    color: var(--secondary-text-color);
                  }
                  section div:has(mark) {
                    border-color: var(--warning-color);
                    background: color-mix(in srgb, var(--warning-color) 12%, var(--card-background-color));
                  }
                  section mark {
                    background: none;
                    color: var(--warning-color);
                  }
                  nav {
                    display: flex;
                    flex-wrap: wrap;
                    align-items: center;
                    gap: 6px;
                    margin: 6px 0 0;
                  }
                  nav small {
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    padding: 5px 10px;
                    border-radius: 999px;
                    font-size: 12px;
                    font-weight: 500;
                    background: var(--secondary-background-color);
                    color: var(--primary-text-color);
                  }
                  nav small b {
                    font-weight: 600;
                    color: var(--secondary-text-color);
                    font-variant-numeric: tabular-nums;
                  }
                  nav > ha-icon {
                    --mdc-icon-size: 18px;
                    color: var(--secondary-text-color);
                    margin-right: 2px;
                  }
                  p {
                    margin: 0;
                    padding: 14px 16px;
                    border-radius: 16px;
                    background: var(--card-background-color);
                    border: 1px solid var(--divider-color);
                    color: var(--secondary-text-color);
                  }
            content: >-
              {%- set events = state_attr('sensor.frigate_vision_history', 'events') or [] -%}
              {%- set today = events | selectattr('start', 'ge', today_at().timestamp()) | list -%}
              {%- if today -%}
                {%- set alerts = today | selectattr('severity', 'eq', 'alert') | list | count -%}
                {%- set flagged = today | selectattr('threat', 'gt', 0) | list | count -%}
                {%- set names = today | map(attribute='names') | map('default', [])
                     | sum(start=[]) | unique | list -%}
                {%- set cams = today | map(attribute='cameras') | map('default', [])
                     | sum(start=[]) | list -%}
                <section>
                <div><b>{{ today | count }}</b><small>Event{{ 's' if today | count != 1 }} today</small></div>
                <div><b>{{ alerts }}</b><small>Alert{{ 's' if alerts != 1 }}</small></div>
                <div>{% if flagged %}<b><mark>{{ flagged }}</mark></b>{% else %}<b>0</b>{% endif %}<small>Flagged</small></div>
                </section>
                {%- if names -%}
                  <nav><ha-icon icon="mdi:account-multiple"></ha-icon>
                  {%- for n in names %}<small>{{ n | e }}</small>{% endfor -%}
                  </nav>
                {%- endif -%}
                <nav><ha-icon icon="mdi:cctv"></ha-icon>
                {%- for c in cams | unique | sort -%}
                  <small>{{ c | replace('_', ' ') | replace('-', ' ') | title | e }}<b>{{ cams | select('eq', c) | list | count }}</b></small>
                {%- endfor -%}
                </nav>
              {%- else -%}
                <p>No camera events today.</p>
              {%- endif -%}

          # ── Filters ──────────────────────────────────────────────────────
          - type: tile
            entity: select.frigate_vision_camera
            name: Camera
            icon: mdi:cctv
            hide_state: true
            features:
              - type: select-options
            grid_options:
              columns: 6
          - type: tile
            entity: input_select.frigate_vision_show
            name: Show
            icon: mdi:filter-variant
            hide_state: true
            features:
              - type: select-options
            grid_options:
              columns: 6

          # ── Event feed ───────────────────────────────────────────────────
          - type: markdown
            card_mod:
              style:
                .: |
                  ha-card {
                    background: none;
                    border: none;
                    box-shadow: none;
                  }
                  ha-markdown {
                    padding: 0 !important;
                  }
                ha-markdown$: |
                  /* Day headings */
                  h2 {
                    margin: 28px 4px 10px;
                    font-size: 13px;
                    font-weight: 600;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    color: var(--secondary-text-color);
                  }
                  h2:first-child { margin-top: 8px; }

                  /* Event cards */
                  article {
                    margin: 0 0 14px;
                    border-radius: 20px;
                    overflow: hidden;
                    background: var(--card-background-color);
                    border: 1px solid var(--divider-color);
                    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 6px 20px rgba(0, 0, 0, 0.06);
                  }
                  article:has(nav mark) {
                    border-color: var(--warning-color);
                    box-shadow: 0 0 0 1px var(--warning-color), 0 6px 20px rgba(0, 0, 0, 0.08);
                  }
                  article:has(nav mark b) {
                    border-color: var(--error-color);
                    box-shadow: 0 0 0 1px var(--error-color), 0 6px 20px rgba(0, 0, 0, 0.08);
                  }

                  /* GIF with camera + time overlaid */
                  figure {
                    position: relative;
                    margin: 0;
                    background: #000;
                  }
                  figure a { display: block; }
                  figure img {
                    display: block;
                    width: 100%;
                    max-height: 60vh;
                    object-fit: contain;
                    margin: 0;
                  }
                  figcaption {
                    position: absolute;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    display: flex;
                    align-items: flex-end;
                    justify-content: space-between;
                    gap: 10px;
                    padding: 36px 14px 10px;
                    background: linear-gradient(to top, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0));
                    color: #fff;
                    font-size: 13px;
                    pointer-events: none;
                  }
                  figcaption b {
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    font-weight: 600;
                  }
                  figcaption small {
                    white-space: nowrap;
                    font-variant-numeric: tabular-nums;
                    opacity: 0.9;
                  }
                  figcaption ha-icon { --mdc-icon-size: 16px; }

                  /* Title + chips */
                  header { padding: 14px 16px 0; }
                  h3 {
                    margin: 0 0 10px;
                    font-size: 17px;
                    font-weight: 600;
                    line-height: 1.3;
                  }
                  nav {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 6px;
                  }
                  nav small, nav strong, nav mark {
                    display: inline-flex;
                    align-items: center;
                    gap: 4px;
                    padding: 4px 10px;
                    border-radius: 999px;
                    font-size: 12px;
                    font-weight: 500;
                    line-height: 1.4;
                    background: var(--secondary-background-color);
                    color: var(--secondary-text-color);
                  }
                  nav strong {
                    background: color-mix(in srgb, var(--primary-color) 15%, transparent);
                    color: var(--primary-color);
                  }
                  nav mark {
                    background: color-mix(in srgb, var(--warning-color) 18%, transparent);
                    color: var(--warning-color);
                  }
                  nav mark:has(b) {
                    background: color-mix(in srgb, var(--error-color) 18%, transparent);
                    color: var(--error-color);
                  }
                  nav mark b {
                    display: inline-flex;
                    align-items: center;
                    gap: 4px;
                    font-weight: inherit;
                  }
                  nav ha-icon { --mdc-icon-size: 14px; }

                  /* Body text */
                  article > p {
                    margin: 12px 16px 0;
                    font-size: 15px;
                    line-height: 1.5;
                  }
                  article > p + p {
                    font-size: 14px;
                    color: var(--secondary-text-color);
                  }
                  article > ha-alert {
                    display: block;
                    margin: 12px 16px 0;
                  }

                  /* Collapsible sections */
                  article > details {
                    margin: 12px 16px 0;
                    padding: 0 12px;
                    border-radius: 12px;
                    background: var(--secondary-background-color);
                  }
                  summary {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    padding: 10px 0;
                    list-style: none;
                    cursor: pointer;
                    font-size: 13px;
                    font-weight: 600;
                    color: var(--primary-color);
                  }
                  summary::-webkit-details-marker { display: none; }
                  summary::after {
                    content: '';
                    width: 7px;
                    height: 7px;
                    margin-right: 4px;
                    border-right: 2px solid currentColor;
                    border-bottom: 2px solid currentColor;
                    transform: rotate(45deg);
                    transition: transform 0.2s;
                  }
                  details[open] > summary::after { transform: rotate(-135deg); }
                  details[open] { padding-bottom: 6px; }
                  details p, details li {
                    font-size: 14px;
                    line-height: 1.5;
                    color: var(--secondary-text-color);
                  }
                  details p { margin: 0 0 8px; }
                  details ul { margin: 0 0 8px; padding-left: 18px; }
                  details li + li { margin-top: 4px; }
                  h4 {
                    margin: 14px 0 4px;
                    padding-top: 12px;
                    border-top: 1px solid var(--divider-color);
                    font-size: 13px;
                    font-weight: 600;
                  }
                  summary + h4 { margin-top: 0; padding-top: 0; border-top: none; }

                  /* Action buttons */
                  footer {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 8px;
                    padding: 14px 16px 16px;
                  }
                  footer a {
                    flex: 1;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 6px;
                    min-height: 40px;
                    padding: 0 12px;
                    border-radius: 12px;
                    background: var(--secondary-background-color);
                    color: var(--primary-text-color);
                    font-size: 13px;
                    font-weight: 500;
                    text-decoration: none;
                    white-space: nowrap;
                  }
                  footer a:first-child,
                  footer a:has(ha-icon[icon="mdi:play"]) {
                    background: var(--primary-color);
                    color: var(--text-primary-color, #fff);
                  }
                  footer ha-icon { --mdc-icon-size: 18px; }

                  /* Empty state */
                  section {
                    padding: 40px 16px;
                    border-radius: 20px;
                    text-align: center;
                    background: var(--card-background-color);
                    border: 1px solid var(--divider-color);
                    color: var(--secondary-text-color);
                  }
                  section ha-icon {
                    --mdc-icon-size: 40px;
                    display: block;
                    margin: 0 auto 8px;
                    opacity: 0.6;
                  }
            content: >-
              {#- Settings -#}

              {%- set limit = 25 -%}

              {%- set time_format = '%-I:%M %p' -%}{#- '%H:%M' for a 24-hour
              clock -#}

              {%- set vehicles = ['car', 'motorcycle', 'bicycle', 'bus',
              'truck', 'boat',
                   'airplane', 'train', 'license_plate'] -%}
              {%- set animals = ['bird', 'cat', 'dog', 'horse', 'sheep', 'cow',
              'bear',
                   'deer', 'fox', 'raccoon', 'squirrel', 'rabbit', 'skunk', 'goat',
                   'kangaroo', 'elephant', 'zebra', 'giraffe', 'bark'] -%}

              {#- Frigate's GenAI calls anyone it didn't recognize an
              "unidentified
                  person", even when they were recognized later or on another camera.
                  Use the recognized name instead, or just "person" if there isn't one. -#}
              {%- macro clean(t, names) -%}
                {%- set adj = '(?:unidentified|unknown|unrecogni[sz]ed|unfamiliar)' -%}
                {%- set nouns = ['person', 'people', 'individual', 'individuals', 'man', 'men',
                     'woman', 'women', 'figure', 'figures', 'visitor', 'visitors'] -%}
                {%- set noun = '(?:' ~ nouns | join('|') ~ ')' -%}
                {%- set ns = namespace(t=t | string) -%}
                {%- if names | count == 1 and names[0] | lower not in ns.t | lower -%}
                  {%- set ns.t = ns.t | regex_replace('\\b(?:(?:an?|the|one) )?' ~ adj
                       ~ ' (?:person|individual|man|woman|figure|visitor)\\b',
                       names[0] | replace('\\', '\\\\'), true) -%}
                {%- endif -%}
                {%- set ns.t = ns.t | regex_replace('\\b(a)n ' ~ adj ~ ' (?=' ~ noun ~ '\\b)', '\\1 ', true) -%}
                {%- for n in nouns -%}
                  {%- set ns.t = ns.t | regex_replace('\\b(?:Unidentified|Unknown|Unrecogni[sz]ed|Unfamiliar) '
                       ~ n ~ '\\b', n | capitalize) -%}
                {%- endfor -%}
                {{- ns.t | regex_replace('\\b' ~ adj ~ ' (?=' ~ noun ~ '\\b)', '', true) -}}
              {%- endmacro -%}


              {%- set camera = states('select.frigate_vision_camera') -%}

              {%- set show = states('input_select.frigate_vision_show') -%}

              {%- set today = now().strftime('%Y-%m-%d') -%}

              {%- set yesterday = (now() -
              timedelta(days=1)).strftime('%Y-%m-%d') -%}

              {%- set events = state_attr('sensor.frigate_vision_history',
              'events') or [] -%}

              {%- set ns = namespace(count=0, day='') -%}


              {%- for e in events -%}
                {%- set cams = e.cameras | default([]) | map('replace', '_', ' ')
                     | map('replace', '-', ' ') | map('title') | list -%}
                {%- set objects = e.objects | default([]) | map('lower') | list -%}
                {%- set names = e.names | default([]) -%}
                {%- set threat = e.threat | default(0) | int(0) -%}

                {%- set camera_ok = camera in cams
                     or camera in ['All cameras', '', 'unknown', 'unavailable'] -%}
                {%- if show == 'Alerts' -%}
                  {%- set show_ok = e.severity == 'alert' -%}
                {%- elif show == 'People' -%}
                  {%- set show_ok = 'person' in objects or names | count > 0 -%}
                {%- elif show == 'Vehicles' -%}
                  {%- set show_ok = objects | select('in', vehicles) | list | count > 0 -%}
                {%- elif show == 'Animals' -%}
                  {%- set show_ok = objects | select('in', animals) | list | count > 0 -%}
                {%- elif show == 'Potential threats' -%}
                  {%- set show_ok = threat > 0 -%}
                {%- else -%}
                  {%- set show_ok = true -%}
                {%- endif -%}

                {%- if camera_ok and show_ok and ns.count < limit -%}
                  {%- set ns.count = ns.count + 1 -%}

                  {#- Day heading -#}
                  {%- set day = e.start | timestamp_custom('%Y-%m-%d') -%}
                  {%- if day != ns.day -%}
                    {%- set ns.day = day -%}
                    <h2>{{ 'Today' if day == today else 'Yesterday' if day == yesterday
                           else e.start | timestamp_custom('%A, %B %-d') }}</h2>
                  {%- endif -%}

                  {#- "Zach detected" / "Person and car detected" -#}
                  {%- set items = names if names
                       else objects | map('replace', '_', ' ') | unique | list -%}
                  {%- if items | count > 1 -%}
                    {%- set subject = items[:-1] | join(', ') ~ ' and ' ~ items[-1] -%}
                  {%- else -%}
                    {%- set subject = items | first | default('activity', true) -%}
                  {%- endif -%}
                  {%- set subject = subject[:1] | upper ~ subject[1:] -%}
                  {%- set title = clean(e.title, names) if e.title else subject ~ ' detected' -%}

                  {%- set duration = '' -%}
                  {%- if e.end | default(0) | float(0) > 0 -%}
                    {%- set s = (e.end - e.start) | round(0) | int -%}
                    {%- set duration = '%d:%02d' | format(s // 60, s % 60) -%}
                  {%- endif -%}

                  {#- A journey's own GIF is deleted after a couple of days; fall back
                      to Frigate's GIF of the first camera after that -#}
                  {%- set gif = e.gif if not e.gif_until | default(0) or now().timestamp() < e.gif_until
                       else e.gif_fallback | default(e.gif, true) -%}

                  {%- set summary = clean(e.summary, names) if e.summary else '' -%}
                  {%- set scene = clean(e.scene, names) if e.scene else '' -%}
                  {%- set lists = namespace(observations=[], concerns=[]) -%}
                  {%- for o in e.observations | default([]) -%}
                    {%- set lists.observations = lists.observations + [clean(o, names)] -%}
                  {%- endfor -%}
                  {%- for c in e.concerns | default([]) -%}
                    {%- set lists.concerns = lists.concerns + [clean(c, names)] -%}
                  {%- endfor -%}
                  {%- set observations = lists.observations -%}
                  {%- set concerns = lists.concerns -%}
                  {#- Each camera's own GenAI summary. Recorded for journeys an AI Task
                      summarized, or that more than one camera summarized -#}
                  {%- set sources = e.sources | default([]) -%}

                  <article>

                  {#- GIF, with the camera path and time over the bottom edge -#}
                  <figure><a href="{{ gif | e }}" target="_blank"><img src="{{ gif | e }}" alt="{{ subject | e }}" width="100%" loading="lazy"></a>
                  <figcaption><b><ha-icon icon="mdi:cctv"></ha-icon>{{ cams | join(' → ') | e }}</b>
                  <small>{{ e.start | timestamp_custom(time_format) }}</small></figcaption></figure>

                  {#- Title and chips -#}
                  <header><h3>{{ title | e }}</h3><nav>
                  {%- if threat >= 2 -%}
                    <mark><b><ha-icon icon="mdi:alert-octagon"></ha-icon>High threat</b></mark>
                  {%- elif threat == 1 -%}
                    <mark><ha-icon icon="mdi:alert"></ha-icon>Flagged</mark>
                  {%- endif -%}
                  {%- if e.severity == 'alert' -%}
                    <strong><ha-icon icon="mdi:bell-ring"></ha-icon>Alert</strong>
                  {%- else -%}
                    <small><ha-icon icon="mdi:motion-sensor"></ha-icon>Detection</small>
                  {%- endif -%}
                  {%- if duration -%}
                    <small><ha-icon icon="mdi:timer-outline"></ha-icon>{{ duration }}</small>
                  {%- endif -%}
                  {%- if e.title and names -%}
                    {%- for n in names %}<small><ha-icon icon="mdi:account"></ha-icon>{{ n | e }}</small>{% endfor -%}
                  {%- endif -%}
                  {%- for z in e.zones | default([]) -%}
                    <small><ha-icon icon="mdi:map-marker"></ha-icon>{{ z | replace('_', ' ') | title | e }}</small>
                  {%- endfor -%}
                  </nav></header>

                  {%- if summary %}<p>{{ summary | e }}</p>{% endif -%}
                  {%- if scene %}<p>{{ scene | e | replace('\n', '<br>') }}</p>{% endif -%}
                  {%- for c in concerns -%}
                    <ha-alert alert-type="warning">{{ c | e }}</ha-alert>
                  {%- endfor -%}
                  {%- if sources -%}
                    <details><summary>Frigate GenAI summaries ({{ sources | count }})</summary>
                    {%- for s in sources -%}
                      {%- set t = s.threat | default(0) | int(0) -%}
                      <h4>{{ '🚨 ' if t >= 2 else '⚠️ ' if t == 1 }}{{ s.camera | replace('_', ' ') | replace('-', ' ') | title | e }}
                        {{- ' · ' ~ s.start | timestamp_custom(time_format) }}</h4>
                      {%- if s.title %}<p><b>{{ clean(s.title, names) | e }}</b></p>{% endif -%}
                      {%- if s.summary %}<p>{{ clean(s.summary, names) | e }}</p>{% endif -%}
                      {%- if s.scene %}<p>{{ clean(s.scene, names) | e | replace('\n', '<br>') }}</p>{% endif -%}
                      {%- set items = s.observations | default([])
                           + s.concerns | default([]) | map('regex_replace', '^', '⚠️ ') | list -%}
                      {%- if items -%}
                        <ul>{% for o in items %}<li>{{ clean(o, names) | e }}</li>{% endfor %}</ul>
                      {%- endif -%}
                    {%- endfor -%}
                    </details>
                  {%- elif observations -%}
                    {#- Older records only kept the cameras' observations -#}
                    <details><summary>Frigate GenAI observations ({{ observations | count }})</summary>
                    <ul>{% for o in observations %}<li>{{ o | e }}</li>{% endfor %}</ul>
                    </details>
                  {%- endif -%}

                  {#- A clip per camera for journeys; older records have just the first -#}
                  {%- set clips = e.clips | default([]) -%}

                  {#- Action buttons; the first one is filled -#}
                  <footer>
                  {%- if clips | count > 1 -%}
                    {%- for c in clips -%}
                      {%- set name = c.camera | replace('_', ' ') | replace('-', ' ') | title -%}
                      {%- if clips | selectattr('camera', 'eq', c.camera) | list | count > 1 -%}
                        {%- set name = name ~ ' ' ~ c.start | timestamp_custom(time_format) -%}
                      {%- endif -%}
                      <a href="{{ c.url | e }}" target="_blank"><ha-icon icon="mdi:play"></ha-icon>{{ name | e }}</a>
                    {%- endfor -%}
                  {%- elif clips or e.clip -%}
                    <a href="{{ (clips[0].url if clips else e.clip) | e }}" target="_blank"><ha-icon icon="mdi:play"></ha-icon>Clip</a>
                  {%- endif -%}
                  <a href="{{ gif | e }}" target="_blank"><ha-icon icon="mdi:arrow-expand"></ha-icon>Full size</a>
                  {%- if e.frigate -%}
                    <a href="{{ e.frigate | e }}" target="_blank"><ha-icon icon="mdi:open-in-new"></ha-icon>Frigate</a>
                  {%- endif -%}
                  </footer>
                  </article>
                {%- endif -%}
              {%- endfor -%}


              {%- if ns.count == 0 -%}
                <section><ha-icon icon="mdi:cctv-off"></ha-icon>
                {%- if events -%}
                  Nothing matches these filters.
                {%- else -%}
                  No events yet. Reviews show up here once their GIF is ready.
                {%- endif -%}
                </section>
              {%- endif -%}
